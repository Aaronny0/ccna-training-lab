96 CST Wed Sep 18 2013)\nclock offset is 15.4356 msec, root delay is 52.17 msec\nroot dispersion is 67.61 msec, peer dispersion is 28.12 msec<\/pre>","x":""}],"iproute":[{"t":"Refer to the exhibit. When PC 1 sends a packet to PC2, the packet has which source and destination IP address when it arrives at interface Gi0/0 on router R2?","o":["source 192.168.20.10 and destination 192.168.20.1","source 192.168.10.10 and destination 192.168.20.10","source 10.10.1.1 and destination 10.10.2.2","source 192.168.10.10 and destination 10.10.2.2"],"c":[1],"m":false,"e":"The source and destination IP addresses of the packets are unchanged on all the way. Only source and destination MAC addresses are changed.","x":"<svg class=\"t\" viewBox=\"0 0 660 100\" role=\"img\" aria-label=\"Network topology\"><line class=\"l\" x1=\"50\" y1=\"40\" x2=\"190\" y2=\"40\"/><text class=\"svgt\" x=\"120\" y=\"36\" text-anchor=\"middle\" style=\"font-size:11px\">192.168.10.0/24<\/text><line class=\"l\" x1=\"190\" y1=\"40\" x2=\"350\" y2=\"40\"/><text class=\"svgt\" x=\"270\" y=\"36\" text-anchor=\"middle\" style=\"font-size:11px\">10.10.1.0/30<\/text><line class=\"l\" x1=\"350\" y1=\"40\" x2=\"510\" y2=\"40\"/><text class=\"svgt\" x=\"430\" y=\"36\" text-anchor=\"middle\" style=\"font-size:11px\">10.10.2.0/30<\/text><line class=\"l\" x1=\"510\" y1=\"40\" x2=\"610\" y2=\"40\"/><text class=\"svgt\" x=\"560\" y=\"36\" text-anchor=\"middle\" style=\"font-size:11px\">192.168.20.0/24<\/text><rect class=\"n\" x=\"14\" y=\"27\" width=\"72\" height=\"26\" rx=\"6\"/><text class=\"svgt\" x=\"50\" y=\"44\" text-anchor=\"middle\" font-weight=\"600\" style=\"font-size:11px\">PC 1<\/text><text class=\"svgt\" x=\"50\" y=\"68\" text-anchor=\"middle\" style=\"font-size:11px\">192.168.10.10<\/text><rect class=\"n\" x=\"154\" y=\"27\" width=\"72\" height=\"26\" rx=\"6\"/><text class=\"svgt\" x=\"190\" y=\"44\" text-anchor=\"middle\" font-weight=\"600\" style=\"font-size:11px\">R1<\/text><rect class=\"n\" x=\"314\" y=\ he route to be installed into the routing table"],"c":[2],"m":false,"e":"","x":""},{"t":"Refer to the exhibit. Which route does R1 select for traffic that is destined to 192.168.16.2?","o":["192.168.16.0/27","192.168.16.0/26","192.168.16.0/24","192.168.16.0/21"],"c":[0],"m":false,"e":"The destination IP addresses match all four entries in the routing table but the 192.168.16.0/27 has the longest prefix so it will be chosen. This is called the “longest prefix match” rule.","x":"<pre>R1#show ip route\nD    192.168.16.0/26 [90/2679326] via 192.168.1.1\nR    192.168.16.0/24 [120/3] via 192.168.1.2\nO    192.168.16.0/21 [110/2] via 192.168.1.3\ni L1 192.168.16.0/27 [115/30] via 192.168.1.4<\/pre>"},{"t":"Which statement about static and dynamic routes is true?","o":["Static routes tell the router how to forward packets to networks that are not directly connected, while dynamic routes tell the router how to forward packets to networks that are directly connected","Dynamic routes are manually configured by a network administrator, while static routes are automatically learned and adjusted by a routing protocol","Static routes are manually configured by a network administrator, while dynamic routes are automatically learned and adjusted by a routing protocol","Dynamic routes tell the router how to forward packets to networks that are not directly connected, while static routes tell the router how to forward packets to networks that are directly connected"],"c":[2],"m":false,"e":"","x":""},{"t":"Which attribute does a router use to select the best path when two or more different routes to the same destination exist from two different routing protocols?","o":["dual algorithm","hop count","administrative distance","metric"],"c":[2],"m":false,"e":"","x":""},{"t":"Router A learns the same route from two different neighbors, one of the neighbor routers is an OSPF neighbor and the other is an EIGRP neighbor. What is the administrative distance of the route that will be installed in the routing table?","o":["110","115","90","20"],"c":[2],"m":false,"e":"The Administrative distance (AD) of EIGRP is 90 while the AD of OSPF is 110 so EIGRP route will be chosen to install into the routing table.","x":""},{"t":"Refer to the exhibit. With which metric was the route to host 172.16.0.202 learned?","o":["1","110","38443","3184439"],"c":[2],"m":false,"e":"<p>Both the line “O 172.16.0.128/25” and “S 172.16.0.0/24” cover the host 172.16.0.202 but with the “longest (prefix) match” rule the router will choose the first route.<\/p><p>Note: Network 172.16.0.192/29 does not cover host 172.16.0.202. For network 172.16.0.192/29:<br>Increment: 8<br>Network address: 172.16.0.192<br>Broadcast address: 172.16.0.199<\/p>","x":"<pre>R1#show ip route | begin gateway\nGateway of last resort is 209.165.200.246 to network 0.0.0.0\nS*    0.0.0.0/0 [1/0] via 209.165.200.246, Serial0/1/0\n                is directly connected, Serial0/1/0\n      172.16.0.0/16 is variably subnetted, 3 subnets, 3 masks\nS        172.16.0.0/24 [1/0] via 207.165.200.254, 00:00:33, Serial0/0/0\nO        172.16.0.128/25 [110/38443] via 207.165.200.254, 00:00:33, Serial0/0/1\nD        172.16.0.192/29 [90/3184439] via 207.165.200.254, 00:00:33, Serial0/0/1\n      209.165.200.0/24 is variably subnetted, 4 subnets, 2 masks\nC        209.165.200.248/30 is directly connected, Serial0/0/0\nL        209.165.200.249/30 is directly connected, Serial0/0/0\nC        209.165.200.252/30 is directly connected, Serial0/0/1\nL        209.165.200.253/32 is directly connected, Serial0/0/1<\/pre>"},{"t":"Refer to the exhibit. Which command would you use to configure a static route on Router 1 to network 192.168.202.0/24 with a nondefault administrative distance?","o":["router1(config)#ip route 1 192.168.201.1 255.255.255.0 192.168.201.2","router1(config)#ip route 192.168.202.0 255.255.255.0 192.168.201.2 5","router1(config)#ip route 5 192.168.202.0 255.255.255.0 192.168.201.2","router1(config)#ip route 192.168.202.0 C<\/text><text class=\"svgt\" x=\"300\" y=\"228\" text-anchor=\"middle\" style=\"font-size:11px\">10.10.13.10/25<\/text><\/svg><pre>R1#show ip route\nGateway of last resort is 10.10.10.18 to network 0.0.0.0\n      10.0.0.0/8 is variably subnetted, 4 subnets, 3 masks\nC        10.10.10.0/30 is directly connected, FastEthernet0/1\nO        10.10.13.0/25 [110/4576] via 10.10.10.1, 02:53:11, FastEthernet0/1\nC        10.10.10.16/30 is directly connected, FastEthernet0/24\nO        10.10.13.144/28 [110/110] via 10.10.10.1, 03:51:21, FastEthernet0/1\nB*    0.0.0.0/0 [20/0] via 10.10.10.18, 02:17:53<\/pre>"},{"t":"Refer to the exhibit. How does router R1 handle traffic to 192.168.10.16?","o":["It selects the OSPF route because it has the lowest cost","It selects the IS-IS route because it has the shortest prefix inclusive of the destination address","It selects the RIP route because it has the longest prefix inclusive of the destination address","It selects the EIGRP route because it has the lowest administrative distance"],"c":[2],"m":false,"e":"Note: The \"O 192.168.10.0/28\" route ranges from 192.168.10.0 to 192.168.10.15 only so it does not include destination 192.168.10.16 so OSPF route is not the correct answer.","x":"<pre>R1# show ip route\nD    192.168.10.0/24 [90/2679326] via 192.168.1.1\nR    192.168.10.0/27 [120/3] via 192.168.1.2\nO    192.168.10.0/28 [110/2] via 192.168.1.3\ni L1 192.168.10.0/13 [115/30] via 192.168.1.4<\/pre>"},{"t":"Refer to the exhibit. If configuring a static default route on the router with the ip route 0.0.0.0 0.0.0.0 10.13.0.1 120 command, how does the router respond?","o":["It starts sending traffic without a specific matching entry in the routing table to GigabitEthernet0/1","It immediately replaces the existing OSPF route in the routing table with the newly configured static route","It ignores the new static route until the existing OSPF default route is removed","It starts load-balancing traffic between the two default routes"],"c":[2],"m":false,"e":"<p>Our new static default route has the Administrative Distance (AD) of 120, which is bigger than the AD of OSPF External route (O*E2) so it will not be pushed into the routing table until the current OSPF External route is removed.<\/p><p>For your information, if you don’t type the AD of 120 (using the command “ip route 0.0.0.0 0.0.0.0 10.13.0.1”) then the new static default route would replace the OSPF default route as the default AD of static route is 1. You will see such line in the routing table:<\/p><pre>S* 0.0.0.0/0 [1/0] via 10.13.0.1<\/pre>","x":"<pre>Gateway of last resort is 10.12.0.1 to network 0.0.0.0\nO*E2 0.0.0.0/0 [110/1] via 10.12.0.1, 00:00:01, GigabitEthernet0/0\n      10.0.0.0/8 is variably subnetted, 2 subnets, 2 masks\nC        10.0.0.0/24 is directly connected, GigabitEthernet0/0\nL        10.0.0.2/32 is directly connected, GigabitEthernet0/0\nC        10.13.0.0/24 is directly connected, GigabitEthernet0/1\nL        10.13.0.2/32 is directly connected, GigabitEthernet0/1<\/pre>"},{"t":"Which of the following dynamic routing protocols are Distance Vector routing protocols? (Choose two)","o":["OSPF","BGP","RIP","IS-IS","EIGRP"],"c":[2,4],"m":true,"e":"","x":""}],"ospf2":[{"t":"Refer to the exhibit. Which configuration issue is preventing the OSPF neighbor relationship from being established between the two routers?","o":["R1 has an incorrect network command for interface Gi1/0","R2 is using the passive-interface default command","R2 should have its network command in area 1","R1 interface Gi1/0 has a larger MTU size"],"c":[3],"m":false,"e":"","x":"<pre>R1#show running-config\nBuilding configuration...\n!\ninterface GigabitEthernet1/0\n mtu 1600\n ip address 192.168.0.1 255.255.255.252\n negotiation auto\n!\nrouter ospf 1\n router-id 1.1.1.1\n passive-interface default\n no passive-interface GigabitEthernet1/0\n network 192.168.0.1 0.0.0.0 area 0\n!\n\nR2#show running-config\nBuilding configuration...\n!\ninterface GigabitEthernet2/0\n ip address 192.168.0.2 255.255.255.252\n negotiation auto\n!\nrouter ospf 1\n router-id 2.2.2.2\n passive-interface default\n no passive-interface GigabitEthernet2/0\n network 192.168.0.2 0.0.0.0 area 0\n!<\/pre>"},{"t":"Refer to the exhibit. What is the next hop address for traffic that is destined to host 10.0.1.5?","o":["10.0.1.50","10.0.1.3","Loopback 0","10.0.1.4"],"c":[0],"m":false,"e":"Traffic destined to host 10.0.1.5 will match the entry “O 10.0.1.5/32 ...” so the next-hop address will be 10.0.1.50.","x":"<pre>R1#show ip route\nCodes: C - connected, S - static, R - RIP, M - mobile, B - BGP\n       D - EIGRP, EX - EIGRP external, O - OSPF, IA - OSPF inter area\n       N1 - OSPF NSSA external type 1, N2 - OSPF NSSA external type 2\n       E1 - OSPF external type 1, E2 - OSPF external type 2\n       i - IS-IS, su - IS-IS summary, L1 - IS-IS level-1, L2 - IS-IS level-2\nGateway of last resort is not set\nC     1.0.0.0/8 is directly connected, Loopback0\n      10.0.0.0/8 is variably subnetted, 4 subnets, 2 masks\nO        10.0.1.3/32 [110/100] via 10.0.1.3, 00:40:07, Serial0\nC        10.0.1.0/24 is directly connected, Serial0\nO        10.0.1.5/32 [110/5] via 10.0.1.50, 00:40:07, Serial0\nO        10.0.1.4/32 [110/10] via 10.0.1.4, 00:40:07, Serial0<\/pre>"},{"t":"Refer to the exhibit. If the switch reboots and all routers have to re-establish OSPF adjacencies, which routers will become the new DR and BDR?","o":["Router R3 will become the DR and router R1 will become the BDR.","Router R4 will become the DR and router R3 will become the BDR.","Router R1 will become the DR and router R2 will become the BDR.","Router R3 will become the DR and router R2 will become the BDR."],"c":[0],"m":false,"e":"After the new election, R3 and R1 have highest priority (of 2) so they will be elected DR and BDR. R3 will be elected DR because its has higher router ID (of 3.3.3.3).","x":"<svg class=\"t\" viewBox=\"0 0 520 330\" role=\"img\" aria-label=\"Network topology\"><line class=\"l\" x1=\"90\" y1=\"50\" x2=\"260\" y2=\"150\"/><text class=\"svgt\" x=\"175\" y=\"96\" text-anchor=\"middle\" style=\"font-size:11px\">(.1)<\/text><line class=\"l\" x1=\"430\" y1=\"50\" x2=\"260\" y2=\"150\"/><text class=\"svgt\" x=\"345\" y=\"96\" text-anchor=\"middle\" style=\"font-size:11px\">(.2)<\/text><line class=\"l\" x1=\"90\" y1=\"250\" x2=\"260\" y2=\"150\"/><text class=\"svgt\" x=\"175\" y=\"196\" text-anchor=\"middle\" style=\"font-size:11px\">(.4)<\/text><line class=\"l\" x1=\"430\" y1=\"250\" x2=\"260\" y2=\"150\"/><text class=\"svgt\" x=\"345\" y=\"196\" text-anchor=\"middle\" style=\"font-size:11px\">(.3)<\/text><rect class=\"n\" x=\"54\" y=\"37\" width=\"72\" height=\"26\" rx=\"6\"/><text class=\"svgt\" x=\"90\" y=\"54\" text-anchor=\"middle\" font-weight=\"600\" style=\"font-size:11px\">R1<\/text><text class=\"svgt\" x=\"90\" y=\"78\" text-anchor=\"middle\" style=\"font-size:11px\">Router ID 1.1.1.1<\/text><text class=\"svgt\" x=\"90\" y=\"91\" text-anchor=\"middle\" style=\"font-size:11px\">Priority 2<\/text><text class=\"svgt\" x=\"90\" y=\"104\" text-anchor=\"middle\" style=\"font-size:11px\">Lo0 192.168.100.100/32<\/text><rect class=\"n\" x=\"394\" y=\"37\" width=\"72\" height=\"26\" rx=\"6\"/><text class=\"svgt\" x=\"430\" y=\"54\" text-anchor=\"middle\" font-weight=\"600\" style=\"font-size:11px\">R2<\/text><text class=\"svgt\" x=\"430\" y=\"78\" text-anchor=\"middle\" style=\"font-size:11px\">Router ID 2.2.2.2<\/text><text class=\"svgt\" x=\"430\" y=\"91\" text-anchor=\"middle\" style=\"font-size:11px\">Priority 1<\/text><text class=\"svgt\" x=\"430\" y=\"104\" text-anchor=\"middle\" style=\"font-size:11px\">Lo0 192.168.100.200/32<\/text><rect class=\"n\" x=\"224\" y=\"137\" width=\"72\" height=\"26\" rx=\"6\"/><text class=\"svgt\" x=\"260\" y=\"154\" text-anchor=\"middle\" font-weight=\"600\" style=\"font-size:11px\">OSPF Switch<\/text><text class=\"svgt\" x=\"260\" y=\"178\" text-anchor=\"middle\" style=\"font-size:11px\">172.16.100.0/16<\/text><rect class=\"n\" x=\"54\" y=\"237\" width=\"72\" height=\"26\" rx=\"6\"/><text class=\"svgt\" x=\"90\" y=\"254\" text-anchor=\"middle\" font-weight=\"600\" style=\"font-size:11px\">R4<\/text><text class=\"svgt\" x=\"90\" y=\"278\" text-anchor=\"middle\" style=\"font-size:11px\">Router ID 4.4.4.4<\/text><text class=\"svgt\" x=\"90\" y=\"291\" text-anchor=\"middle\" style=\"font-size:11px\">Priority 1<\/text><text class=\"svgt\" x=\"90\" y=\"304\" text-anchor=\"middle\" style=\"font-size:11px\">Lo0 10.10.10.40/32<\/text><rect class=\"n\" x=\"394\" y=\"237\" width=\"72\" height=\"26\" rx=\"6\"/><text class=\"svgt\" x=\"430\" y=\"254\" text-anchor=\"middle\" font-weight=\"600\" style=\"font-size:11px\">R3<\/text><text class=\"svgt\" x=\"430\" y=\"278\" text-anchor=\"middle\" style=\"font-size:11px\">Router ID 3.3.3.3<\/text><text class=\"svgt\" x=\"430\" y=\"291\" text-anchor=\"middle\" style=\"font-size:11px\">Priority 2<\/text><text class=\"svgt\" x=\"430\" y=\"304\" text-anchor=\"middle\" style=\"font-size:11px\">Lo0 10.10.10.30/32<\/text><\/svg>"},{"t":"Which step in the link-state routing process is described by a router sending Hello packets out all of the OSPF-enabled interfaces?","o":["electing the designated router","establishing neighbor adjacencies","injecting the default route","exchanging link-state advertisements"],"c":[1],"m":false,"e":"","x":""},{"t":"Which two minimum parameters must be configured on an active interface to enable OSPFv2 to operate? (Choose two)","o":["OSPF stub flag","OSPF process ID","OSPF area","OSPF MD5 authentication key","IPv6 address"],"c":[1,2],"m":true,"e":"<p>To configure OSPFv2 under interface mode we must use the command “ip ospf {process-id} area {area-id}”. For example:<\/p><pre>R1(config-if)#ip ospf 1 area 2<\/pre>","x":""},{"t":"Refer to the exhibit. After the configuration is applied, the two routers fail to establish an OSPF neighbor relationship. What is the reason for the problem?","o":["The OSPF router IDs are mismatched","Router2 is using the default hello timer","The network statement on Router1 is misconfigured","The OSPF process IDs are mismatched"],"c":[1],"m":false,"e":"","x":"<svg class=\"t\" viewBox=\"0 0 420 90\" role=\"img\" aria-label=\"Network topology\"><line class=\"l\" x1=\"90\" y1=\"40\" x2=\"330\" y2=\"40\"/><text class=\"svgt\" x=\"210\" y=\"36\" text-anchor=\"middle\" style=\"font-size:11px\">Gi1/1 --- Gi1/1<\/text><rect class=\"n\" x=\"54\" y=\"27\" width=\"72\" height=\"26\" rx=\"6\"/><text class=\"svgt\" x=\"90\" y=\"44\" text-anchor=\"middle\" font-weight=\"600\" style=\"font-size:11px\">Router1<\/text><rect class=\"n\" x=\"294\" y=\"27\" width=\"72\" height=\"26\" rx=\"6\"/><text class=\"svgt\" x=\"330\" y=\"44\" text-anchor=\"middle\" font-weight=\"600\" style=\"font-size:11px\">Router2<\/text><\/svg><pre>Router1(config)#interface GigabitEthernet1/1\nRouter1(config-if)#description ***Connection to Router2***\nRouter1(config-if)#ip address 10.10.10.1 255.255.255.252\nRouter1(config-if)#ip ospf hello-interval 5\nRouter1(config)#router ospf 1000\nRouter1(config-router)#router-id 1.1.1.1\nRouter1(config-router)#network 10.10.10.0 0.0.0.3 area 0\n\nRouter2(config)#interface GigabitEthernet1/1\nRouter2(config-if)#description ***Connection to Router1***\nRouter2(config-if)#ip address 10.10.10.2 255.255.255.252\nRouter2(config)#router ospf 1001\nRouter2(config-router)#router-id 2.2.2.2\nRouter2(config-router)#network 10.10.10.0 0.0.0.3 area 0\nRouter2(config-router)#passive-interface default\nRouter2(config-router)#no passive-interface GigabitEthernet1/1<\/pre>"},{"t":"An engineer must configure an OSPF neighbor relationship between router R1 and R3. The authentication configuration has been configured and the connecting interfaces are in the same 192.168.1.0/30 subnet. What are the next two steps to complete the configuration? (Choose two)","o":["configure the hello and dead timers to match on both sides","configure the interfaces as OSPF active on both sides","configure the same router ID on both routing processes","configure both interfaces with the same area ID","configure the same process ID for the router OSPF process"],"c":[1,3],"m":true,"e":"We don’t need to configure hello and dead timers for OSPF neighbor as OSPF can auto negotiate the network type (with the same hello and dead timers on both sides). We just have to make sure both interfaces are running OSPF and they are in the same area ID.","x":""},{"t":"Refer to the exhibit. What action establishes the OSPF neighbor relationship without forming an adjacency?","o":["modify priority","modify hello interval","modify process ID","modify network type"],"c":[1],"m":false,"e":"<p>In this question, R1 &amp; R2 will not establish OSPF neighbor relationship because the hello &amp; dead intervals are not the same.<\/p><p>If we modify the hello &amp; dead intervals to the same values then R1 &amp; R2 will become OSPF neighbors. But they will establish OSPF adjacency too.<\/p><p>Answer 'modify process ID' is not correct as the process ID is only locally significant.<\/p><p>Answer 'modify hello interval' is partially correct as we need to change both “hello and dead” interval, not “hello” interval only.<\/p><p>Answer 'modify priority' is a good answer because if we change both the priorities to 0 then they cannot elect DR/BDR so the adjacency cannot be complete.<\/p><p>Answer 'modify network type' is a good answer too because if we change one of the network type to “point to point” then OSPF neighbor relationship can still come up but adjacency cannot (no routes are getting ...<\/p><p>But two good answers are only correct after fixing the hello &amp; dead intervals to the same value (so that OSPF ...<\/p><p>Two routers will become neighbors if they agree on the following: Same Area ID, same authentication (if used), same hello &amp; dead intervals, same subnet mask and same stub area flag.<\/p><p>Reference: <a href='https://www.cisco.com/c/en/us/support/d ation"],"c":[2],"m":false,"e":"For 802.1q encapsulation, the native VLAN must matched at both side; otherwise the link will not work. In this case the native VLAN of S1 is 1 while the native VLAN of S2 is 2. Therefore when a frame from VLAN 1 is sent from S1 to S2, it will be untagged before leaving S1. When S2 receives this untagged frame, it believes this frame was sent from the native VLAN. But the native VLAN on S2 is VLAN 2, not VLAN 1. Therefore only hosts on VLAN 2 of S2 will receive this frame.","x":"<svg class=\"t\" viewBox=\"0 0 460 130\" role=\"img\" aria-label=\"Network topology\"><line class=\"l\" x1=\"100\" y1=\"60\" x2=\"360\" y2=\"60\"/><text class=\"svgt\" x=\"230\" y=\"56\" text-anchor=\"middle\" style=\"font-size:11px\">Fa0/1<\/text><rect class=\"n\" x=\"64\" y=\"47\" width=\"72\" height=\"26\" rx=\"6\"/><text class=\"svgt\" x=\"100\" y=\"64\" text-anchor=\"middle\" font-weight=\"600\" style=\"font-size:11px\">S1<\/text><text class=\"svgt\" x=\"100\" y=\"88\" text-anchor=\"middle\" style=\"font-size:11px\">VLAN 1: 192.168.1.82/29<\/text><text class=\"svgt\" x=\"100\" y=\"101\" text-anchor=\"middle\" style=\"font-size:11px\">VLAN 2: 192.168.2.190/28<\/text><rect class=\"n\" x=\"324\" y=\"47\" width=\"72\" height=\"26\" rx=\"6\"/><text class=\"svgt\" x=\"360\" y=\"64\" text-anchor=\"middle\" font-weight=\"600\" style=\"font-size:11px\">S2<\/text><text class=\"svgt\" x=\"360\" y=\"88\" text-anchor=\"middle\" style=\"font-size:11px\">VLAN 1: 192.168.1.86/29<\/text><text class=\"svgt\" x=\"360\" y=\"101\" text-anchor=\"middle\" style=\"font-size:11px\">VLAN 2: 192.168.2.172/28<\/text><\/svg><pre>S1#show interface trunk\nPort   Mode  Encapsulation  Status    Native vlan\nFa0/1  on    802.1q         trunking  1\nPort   Vlans allowed on trunk\nFa0/1  1-1005\nPort   Vlans allowed and active in management domain\nFa0/1  1,2\n\nS2#show interface trunk\nPort   Mode  Encapsulation  Status    Native vlan\nFa0/1  on    802.1q         trunking  2\nPort   Vlans al
