<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCNA 200-301 Questions</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root{--bg:#F2F4F6;--card:#fff;--ink:#14232F;--mute:#5B6B78;--line:#D5DCE2;--acc:#0E7C86;--link:#2B6CB0;--ok:#1B7A43;--okbg:#E3F3E9;--ko:#B3261E;--kobg:#FBE7E5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A22;--card:#16252F;--ink:#E6EDF2;--mute:#92A3B0;--line:#2B3C48;--acc:#4FC3CE;--link:#7DB7F0;--ok:#6CD39B;--okbg:#17352A;--ko:#FF8A80;--kobg:#3A1E1D}}
:root[data-theme="dark"]{--bg:#0F1A22;--card:#16252F;--ink:#E6EDF2;--mute:#92A3B0;--line:#2B3C48;--acc:#4FC3CE;--link:#7DB7F0;--ok:#6CD39B;--okbg:#17352A;--ko:#FF8A80;--kobg:#3A1E1D}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.6rem;margin:.2em 0 .1em}
.sub{color:var(--mute);margin:0 0 16px}
.idx{width:100%;border-collapse:collapse;background:var(--card);table-layout:fixed}
.idx td{border:1px solid var(--line);padding:9px 10px;vertical-align:middle;overflow-wrap:anywhere}
.idx a{color:var(--link);text-decoration:none;cursor:pointer}
.idx a:hover,.idx a:focus-visible{text-decoration:underline;outline:none}
.idx .na{color:var(--mute)}
.idx small{display:block;color:var(--mute);font-size:.72rem}
@media (max-width:620px){.idx,.idx tbody,.idx tr,.idx td{display:block;width:100%}.idx td:empty{display:none}}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{flex:1;min-width:84px;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:inherit;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.back{padding:7px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:inherit;cursor:pointer;margin-bottom:8px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;display:flex;justify-content:space-between;align-items:center;z-index:2;border-bottom:1px solid var(--line);margin-bottom:14px}
.bar button{padding:6px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:inherit;cursor:pointer}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.q h2{font-size:1.05rem;margin:0 0 8px;color:var(--acc)}
.q p{margin:.3em 0 10px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px 12px;margin:6px 0;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.o span{white-space:pre-line}
.o input{margin-top:5px}
.o.ok{background:var(--okbg);border-color:var(--ok)}
.o.ko{background:var(--kobg);border-color:var(--ko)}
.o[disabled]{cursor:default}
.row{display:grid;grid-template-columns:1fr minmax(180px,1fr);gap:10px;align-items:center;padding:8px 10px;margin:6px 0;border:1px solid var(--line);border-radius:8px}
.row .m{font-size:.9rem;grid-column:1/-1}
.row.ok{background:var(--okbg);border-color:var(--ok)}
.row.ko{background:var(--kobg);border-color:var(--ko)}
@media (max-width:520px){.row{grid-template-columns:1fr}}
select{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}
.o:focus-visible,.tabs button:focus-visible,.bar button:focus-visible,.chk:focus-visible,.back:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sub2{margin-top:8px;padding:8px 12px;border-radius:8px;font-size:.95rem}
.sub2.ok{background:var(--okbg)}.sub2.ko{background:var(--kobg)}
.chk{margin-top:6px;padding:8px 14px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:inherit;cursor:pointer}
.ex{margin-top:8px;color:var(--mute);font-size:.95rem}
.ex p{margin:.5em 0}
.ex a{color:var(--acc);word-break:break-all}
pre{font:13.5px/1.5 "IBM Plex Mono",ui-monospace,monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow-x:auto;margin:8px 0 12px}
.tw{overflow-x:auto;margin:8px 0}
.tw table,.q table{border-collapse:collapse;min-width:420px;font-size:.9rem}
.q th,.q td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.q th{background:var(--bg)}
svg.t{max-width:100%;height:auto;display:block;margin:8px 0 12px;background:var(--bg);border:1px solid var(--line);border-radius:6px}
.res{background:var(--card);border:2px solid var(--acc);border-radius:10px;padding:16px;text-align:center}
.svgt{fill:var(--ink);font:12px "IBM Plex Sans",sans-serif}
.n{fill:var(--card);stroke:var(--acc);stroke-width:2}
.l{stroke:var(--mute);stroke-width:2}
.d{stroke:var(--mute);stroke-width:2;stroke-dasharray:5 4}
.hint{color:var(--mute);font-size:.9rem;margin:.2em 0 8px}
.dd{display:grid;gap:12px}
.pool{min-height:52px;padding:8px;border:1px dashed var(--line);border-radius:8px;display:flex;flex-wrap:wrap;gap:8px;background:var(--bg)}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.zone{border:2px dashed var(--line);border-radius:8px;padding:8px;background:var(--card)}
.zone .zt{font-weight:600;font-size:.9rem;margin-bottom:6px}
.slot{min-height:46px;display:flex;flex-direction:column;gap:6px}
.over{outline:2px solid var(--acc);outline-offset:1px;background:var(--bg)}
.chip{padding:8px 11px;border:1px solid var(--acc);border-radius:8px;background:var(--card);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;font-size:.93rem;line-height:1.35}
.chip.sel{background:var(--acc);color:#fff}
.chip.dragging{opacity:.35}
.chip.ghost{position:fixed;z-index:9999;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:.95;cursor:grabbing}
.chip.locked{cursor:default;touch-action:auto}
.chip.ok{background:var(--okbg);border-color:var(--ok);color:var(--ink)}
.chip.ko{background:var(--kobg);border-color:var(--ko);color:var(--ink)}
.chip small{display:block;color:var(--mute);font-size:.8rem}
.chip:focus-visible,.zone:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main>
<div id="home">
<h1>CCNA 200-301</h1>
<p class="sub">Click a quiz to start it. Each quiz has 5 rounds with a different question order. Drag and drop questions use real drag and drop. Quizzes shown in grey are not available yet.</p>
<table class="idx" id="idx"></table>
</div>
<div id="quiz" hidden>
<button class="back" id="back">← Back to the list</button>
<h1 id="qtitle"></h1>
<div class="tabs" id="rounds"></div>
<div class="bar"><span id="score"></span><button id="reset">Restart this round</button></div>
<div id="list"></div>
<div id="result"></div>
</div>
</main>
<script>
var D={"stp":[{"t":"Refer to the exhibit. After the election process what is the root bridge in the HQ LAN?","x":"<svg class=\"t\" viewBox=\"0 0 600 290\" role=\"img\" aria-label=\"Network topology\"><line class=\"l\" x1=\"150\" y1=\"30\" x2=\"150\" y2=\"130\"/><line class=\"l\" x1=\"150\" y1=\"30\" x2=\"450\" y2=\"130\"/><line class=\"l\" x1=\"450\" y1=\"30\" x2=\"150\" y2=\"130\"/><line class=\"l\" x1=\"450\" y1=\"30\" x2=\"450\" y2=\"130\"/><line class=\"l\" x1=\"150\" y1=\"130\" x2=\"450\" y2=\"130\"/><line class=\"l\" x1=\"150\" y1=\"130\" x2=\"150\" y2=\"230\"/><line class=\"l\" x1=\"450\" y1=\"130\" x2=\"450\" y2=\"230\"/><line class=\"l\" x1=\"150\" y1=\"230\" x2=\"450\" y2=\"230\"/><rect class=\"n\" x=\"118\" y=\"16\" width=\"64\" height=\"28\" rx=\"6\"/><text class=\"svgt\" x=\"150\" y=\"34\" text-anchor=\"middle\" font-weight=\"600\">HQ1<\/text><rect class=\"n\" x=\"418\" y=\"16\" width=\"64\" height=\"28\" rx=\"6\"/><text class=\"svgt\" x=\"450\" y=\"34\" text-anchor=\"middle\" font-weight=\"600\">HQ2<\/text><rect class=\"n\" x=\"118\" y=\"116\" width=\"64\" height=\"28\" rx=\"6\"/><text class=\"svgt\" x=\"150\" y=\"134\" text-anchor=\"middle\" font-weight=\"600\">Switch 1<\/text><rect class=\"n\" x=\"418\" y=\"116\" width=\"64\" height=\"28\" rx=\"6\"/><text class=\"svgt\" x=\"450\" y=\"134\" text-anchor=\"middle\" font-weight=\"600\">Switch 2<\/text><rect class=\"n\" x=\"118\" y=\"216\" width=\"64\" height=\"28\" rx=\"6\"/><text class=\"svgt\" x=\"150\" y=\"234\" text-anchor=\"middle\" font-weight=\"600\">Switch 3<\/text><text class=\"svgt\" x=\"150\" y=\"260\" text-anchor=\"middle\">0C.0E.15.1D.3C.9A<\/text><rect class=\"n\" x=\"418\" y=\"216\" width=\"64\" height=\"28\" rx=\"6\"/><text class=\"svgt\" x=\"450\" y=\"234\" text-anchor=\"middle\" font-weight=\"600\">Switch 4<\/text><text class=\"svgt\" x=\"450\" y=\"260\" text-anchor=\"middle\">0C.E0.19.A1.4D.16<\/text><\/svg><pre>Switch1: 0C.E0.38.57.24.22\nSwitch2: 0C.0E.15.22.1A.61\nSwitch3: 0C.0E.15.1D.3C.9A\nSwitch4: 0C.E0.19.A1.4D.16<\/pre>","o":["Switch 2","Switch 1","Switch 4","Switch 3"],"c":[3],"m":false,"e":""},{"t":"Which spanning-tree enhancement avoids the learning and listening states and immediately places ports in the forwarding state?","x":"","o":["BPDUfilter","Backbonefast","BPDUguard","PortFast"],"c":[3],"m":false,"e":""},{"t":"Which result occurs when PortFast is enabled on an interface that is connected to another switch?","x":"","o":["VTP is allowed to propagate VLAN configuration information from switch to switch automatically.","Spanning tree may fail to detect a switching loop in the network that causes broadcast storms","Root port choice and spanning tree recalculation are accelerated when a switch link goes down","After spanning tree converges PortFast shuts down any port that receives BPDUs."],"c":[1],"m":false,"e":"Enabling the PortFast feature causes a switch or a trunk port to enter the STP forwarding-state immediately or upon a linkup event, thus bypassing the listening and learning states.<br>Note: To enable portfast on a trunk port you need the trunk keyword “spanning-tree portfast trunk“"},{"t":"Refer to exhibit. How does SW2 interact with other switches in this VTP domain?","x":"<pre>SW2\nvtp domain cisco\nvtp mode transparent\nvtp password test\ninterface fastethernet0/1\ndescription connection to SW1\nswitchport mode trunk\nswitchport trunk encapsulation dot1q<\/pre>","o":["It processes VTP updates from any VTP clients on the network on its access ports","It receives updates from all VTP servers and forwards all locally configured VLANs out all trunk ports","It transmits and processes VTP updates from any VTP Clients on the network on its trunk ports","It forwards only the VTP advertisements that it receives on its trunk ports"],"c":[3],"m":false,"e":"The VTP mode of SW2 is transparent so it only forwards the VTP updates it receives to its trunk links without processing them."},{"t":"Refer to the exhibit. What two conclusions should be made about this configuration? (Choose two)","x":"<pre>SW1#show spanning-tree vlan 30\n\nVLAN0030\nSpanning tree enabled protocol rstp\nRoot ID  Priority  32798\n         Address   0018.7363.4300\n         Cost      2\n         Port      13 (FastEthernet2/1)\n         Hello Time 2 sec  Max Age 20 sec  Forward Delay 20 sec\n&lt;output omitted&gt;<\/pre>","o":["The spanning-tree mode is PVST+","The spanning-tree mode is Rapid PVST+","The root port is FastEthernet 2/1","This is a root bridge","The designated port is FastEthernet 2/1"],"c":[1,2],"m":true,"e":"This bridge is not the root bridge because it does not have the statement “This bridge is the root”. When the local switch is not the root bridge, the port it shows would be the root port to the root bridge. Therefore in this case FastEthernet2/1 is the root port that is connected to the root bridge."},{"t":"How does STP prevent forwarding loops at OSI Layer 2?","x":"","o":["MAC address forwarding","Port blocking","Collision avoidance.","TTL"],"c":[1],"m":false,"e":""},{"t":"Refer to the exhibit. Which switch becomes the root bridge?","x":"<svg class=\"t\" viewBox=\"0 0 640 300\" role=\"img\" aria-label=\"Network topology\"><line class=\"l\" x1=\"300\" y1=\"70\" x2=\"520\" y2=\"150\"/><line class=\"l\" x1=\"520\" y1=\"150\" x2=\"300\" y2=\"230\"/><line class=\"l\" x1=\"300\" y1=\"230\" x2=\"80\" y2=\"150\"/><line class=\"l\" x1=\"80\" y1=\"150\" x2=\"300\" y2=\"70\"/><rect class=\"n\" x=\"268\" y=\"56\" width=\"64\" height=\"28\" rx=\"6\"/><text class=\"svgt\" x=\"300\" y=\"74\" text-anchor=\"middle\" font-weight=\"600\">S4<\/text><text class=\"svgt\" x=\"300\" y=\"34\" text-anchor=\"middle\">Bridge Priority: 32768<\/text><text class=\"svgt\" x=\"300\" y=\"48\" text-anchor=\"middle\">MAC: DD:DD:DD:DD:DD:DD<\/text><rect class=\"n\" x=\"488\" y=\"136\" width=\"64\" height=\"28\" rx=\"6\"/><text class=\"svgt\" x=\"520\" y=\"154\" text-anchor=\"middle\" font-weight=\"600\">S3<\/text><text class=\"svgt\" x=\"520\" y=\"180\" text-anchor=\"middle\">Bridge Priority: 30000<\/text><text class=\"svgt\" x=\"520\" y=\"194\" text-anchor=\"middle\">MAC: CC:CC:CC:CC:CC:CC<\/text><rect class=\"n\" x=\"268\" y=\"216\" width=\"64\" height=\"28\" rx=\"6\"/><text class=\"svgt\" x=\"300\" y=\"234\" text-anchor=\"middle\" font-weight=\"600\">S2<\/text><text class=\"svgt\" x=\"300\" y=\"260\" text-anchor=\"middle\">Bridge Priority: 30000<\/text><text class=\"svgt\" x=\"300\" y=\"274\" text-anchor=\"middle\">MAC: BB:BB:BB:BB:BB:BB<\/text><rect class=\"n\" x=\"48\" y=\"136\" width=\"64\" height=\"28\" rx=\"6\"/><text class=\"svgt\" x=\"80\" y=\"154\" text-anchor=\"middle\" font-weight=\"600\">S1<\/text><text class=\"svgt\" x=\"80\" y=\"180\" text-anchor=\"middle\">Bridge Priority: 32768<\/text><text class=\"svgt\" x=\"80\" y=\"194\" text-anchor=\"middle\">MAC: AA:AA:AA:AA:AA:AA<\/text><\/svg>","o":["S3","S1","S2","S4"],"c":[2],"m":false,"e":""},{"t":"Which state does the switch port move to when PortFast is enabled?","x":"","o":["learning","listening","forwarding","blocking"],"c":[2],"m":false,"e":""},{"t":"Refer to the exhibit. Which switch in this configuration will be elected as the root bridge?","x":"<svg class=\"t\" viewBox=\"0 0 600 220\" role=\"img\" aria-label=\"Network topology\"><line class=\"l\" x1=\"100\" y1=\"40\" x2=\"500\" y2=\"40\"/><line class=\"l\" x1=\"500\" y1=\"40\" x2=\"500\" y2=\"160\"/><line class=\"l\" x1=\"500\" y1=\"160\" x2=\"100\" y2=\"160\"/><line class=\"l\" x1=\"100\" y1=\"160\" x2=\"100\" y2=\"40\"/><rect class=\"n\" x=\"68\" y=\"26\" width=\"64\" height=\"28\" rx=\"6\"/><text class=\"svgt\" x=\"100\" y=\"44\" text-anchor=\"middle\" font-weight=\"600\">SW1<\/text><text class=\"svgt\" x=\"100\" y=\"18\" text-anchor=\"middle\">0C:E0:38:00:36:75<\/text><rect class=\"n\" x=\"468\" y=\"26\" width=\"64\" height=\"28\" rx=\"6\"/><text class=\"svgt\" x=\"500\" y=\"44\" text-anchor=\"middle\" font-weight=\"600\">SW4<\/text><text class=\"svgt\" x=\"500\" y=\"18\" text-anchor=\"middle\">0C:E0:18:A1:B3:19<\/text><rect class=\"n\" x=\"68\" y=\"146\" width=\"64\" height=\"28\" rx=\"6\"/><text class=\"svgt\" x=\"100\" y=\"164\" text-anchor=\"middle\" font-weight=\"600\">SW2<\/text><text class=\"svgt\" x=\"100\" y=\"190\" text-anchor=\"middle\">0C:0E:15:22:05:97<\/text><rect class=\"n\" x=\"468\" y=\"146\" width=\"64\" height=\"28\" rx=\"6\"/><text class=\"svgt\" x=\"500\" y=\"164\" text-anchor=\"middle\" font-weight=\"600\">SW3<\/text><text class=\"svgt\" x=\"500\" y=\"190\" text-anchor=\"middle\">0C:0E:15:1A:3C:9D<\/text><\/svg><pre>SW1: 0C:E0:38:00:36:75\nSW2: 0C:0E:15:22:05:97\nSW3: 0C:0E:15:1A:3C:9D\nSW4: 0C:E0:18:A1:B3:19<\/pre>","o":["SW4","SW2","SW1","SW3"],"c":[3],"m":false,"e":"As this question did not state about bridge priority so we can assume all of them are using the default priority. Therefore the switch with lowest MAC address wins the election."},{"t":"What criteria is used first during the root port selection process?","x":"","o":["lowest neighbor’s bridge ID","lowest path cost to the root bridge","lowest neighbor’s port ID","local port ID"],"c":[1],"m":false,"e":""},{"t":"When using Rapid PVST+, which command guarantees the switch is always the root bridge for VLAN 200?","x":"","o":["spanning-tree vlan 200 root primary","spanning-tree vlan 200 priority 38572422","spanning-tree vlan 200 priority 614440","spanning-tree vlan 200 priority 0"],"c":[3],"m":false,"e":""},{"t":"What is the primary effect of the spanning-tree portfast command?","x":"","o":["It enables BPDU messages","It immediately puts the port into the forwarding state when the switch is reloaded","It minimizes spanning-tree convergence time","It immediately enables the port in the listening state"],"c":[2],"m":false,"e":"The purpose of Port Fast is to minimize the time interfaces must wait for spanning-tree to converge, it is effective only when used on interfaces connected to end stations."},{"t":"Which configuration ensures that the switch is always the root for VLAN 750?","x":"","o":["Switch(config)#spanning-tree vlan 750 priority 38003685","Switch(config)#spanning-tree vlan 750 priority 0","Switch(config)#spanning-tree vlan 750 root primary","Switch(config)#spanning-tree vlan 750 priority 614440"],"c":[1],"m":false,"e":"The keyword here is \"always\" so we should set the priority to the lowest value which is 0. If we use the \"primary root\" keyword then our switch is only set to the lower value compared to other switches. And new switch added in the future can be set to lower value than our switch to take over the root role."}],"switch":[{"t":"What are two functions of a Layer 2 switch? (Choose two)","x":"","o":["selects the best route between networks on a WAN","moves packets between different VLANs","acts as a central point for association and authentication servers","moves packets within a VLAN","makes forwarding decisions based on the MAC address of a packet"],"c":[3,4],"m":true,"e":""},{"t":"The SW1 interface g0/1 is in the down/down state. Which two configurations are valid reasons for the interface conditions? (Choose two)","x":"","o":["The interface is error-disabled","The interface is shut down","There is a protocol mismatch","There is a duplex mismatch","There is a speed mismatch"],"c":[0,4],"m":true,"e":"<p>The down/down state indicates a Layer 1 problem -> “Protocol mismatch” answer is a Layer 2 problem so it is not correct.<\/p><p>Duplex should be matched on both side but it is not a must -> Therefore “duplex mismatch” is not a correct answer.<\/p><p>The most common Layer 1 problems are faulty or incorrect cabling or hardware failure but none of them is in the answer choices.<\/p><p>If the port is error-disabled, we will see it in down/down state so this answer is correct.<\/p><pre>SW#sh int f1/0/1\nFastEthernet1/0/1 is down, line protocol is down (err-disabled)<\/pre><p>There are only two answers left, which are “speed mismatch” and “interface is shut down”. According to the table below (from the old and retired ICND1 100-101 Official Cert Guide), speed mismatch is also a cause of down/down state.<\/p><div class=\"tw\"><table><caption>Table 10-4 LAN Switch Interface Status Codes<\/caption><tr><th>Line Status<\/th><th>Protocol Status<\/th><th>Interface Status<\/th><th>Typical Root Cause<\/th><\/tr><tr><td>Administratively Down<\/td><td>Down<\/td><td>disabled<\/td><td>The interface is configured with the <b>shutdown<\/b> command.<\/td><\/tr><tr><td>Down<\/td><td>Down<\/td><td>notconnect<\/td><td>No cable; bad cable; wrong cable pinouts; the speeds are mismatched on the two connected devices; the device on the other end of the cable is (a) powered off, (b) <b>shutdown<\/b>, or (c) error disabled.<\/td><\/tr><tr><td>Up<\/td><td>Down<\/td><td>notconnect<\/td><td>An interface up/down state is not expected on LAN switch physical interfaces.<\/td><\/tr><tr><td>Down<\/td><td>Down (err-disabled)<\/td><td>err-disabled<\/td><td>Port security has disabled the interface.<\/td><\/tr><tr><td>Up<\/td><td>Up<\/td><td>connected<\/td><td>The interface is working.<\/td><\/tr><\/table><\/div><p>Note:<br>+ Speed must match between two ends. We tested speed mismatch on real device but we only received “up/down” state.<br>+ If “interface is shut down” then we will see the “administratively down/down”, not “down/down” state. But the “down/down” state would be seen on the far end interface.<\/p>"},{"t":"How does the dynamically-learned MAC address feature function?","x":"","o":["It requires a minimum number of secure MAC addresses to be filled dynamically","The ports are restricted and learn up to a maximum of 10 dynamically-learned addresses","Switches dynamically learn MAC addresses of each connecting CAM table","The CAM table is empty until ingress traffic arrives at each port"],"c":[3],"m":false,"e":"The MAC addresses in the CAM table are the source MAC addresses only. Therefore it only learns MAC address from ingress traffic."},{"t":"Which three statements about MAC addresses are correct? (Choose three)","x":"","o":["The MAC address of a device must be configured in the Cisco IOS CLI by a user with administrative privileges","A MAC address contains two main components, the first of which identifies the network on which the host resides and the second of which uniquely identifies the host on the network","A MAC address contains two main components, the first of which identifies the manufacturer of the hardware and the second of which uniquely identifies the hardware","An example of a MAC address is 0A:26:B8:D6:65:90","To communicate with other devices on a network, a network device must have a unique MAC address","The MAC address is also referred to as the IP address"],"c":[2,3,4],"m":true,"e":""}],"dd":[{"t":"Refer to the exhibit.","x":"<pre>[root#HostTime=]#ip route\ndefault via 192.168.1.193 dev eth1 proto static\n192.168.1.0/26 dev sth1 proto kernel scope link src 192.168.1.200 metric 1\n\n[root#HostTime=]#ip addr show eth1\neth1:mtu 1500 qdisc pfifo_fast qlan 1000\n link/ether 00:0C:22:83:79:A3 brd ff:ff:ff:ff:ff:ff\n inet 192.168.1.200/26 hrd 192.168.1.255 scope global eth1\n inet6 fe80::20c::29ff:fe89:79b3/64 scope link\n valid_lft forever preferred_lft forever<\/pre><p>Drag and drop the networking parameters from the left onto the correct values on the right.<\/p>","it":["00:0C:22","00:0C:22:83:79:A3","192.168.1.193","192.168.1.200","255.255.255.192"],"g":["NIC vendor OUI","NIC MAC address","default gateway","host IP address","subnet mask"],"a":[0,1,2,3,4],"e":"<p>+ 00:0C:22: NIC vendor OUI<br>+ 00:0C:22:83:79:A3: NIC MAC address<br>+ 192.168.1.193: default gateway<br>+ 192.168.1.200: host IP address<br>+ 255.255.255.192: subnet mask<\/p><p>The “ip route” and “ip addr show eth1” are Linux commands.<br>+ “ip route”: display the routing table<br>+ “ip addr show eth1”: get depth information (only on eth1 interface) about your network interfaces like IP Address, MAC Address information<\/p>"},{"t":"Drag and drop the functions from the left onto the correct network components on the right.","x":"","it":["1. holds the TCP/IP settings to be distributed to the clients","2. resolves web URLs to IP addresses","3. stores a list of IP addresses mapped to names","4. assigns a default gateway to a client","5. assigns IP addresses to enabled clients"],"g":["DHCP Server","DNS Server"],"a":[0,1,1,0,0],"e":""},{"t":"Drag the OSPF parameters to the correct places on the right. Note: There is one unused answer in this question.","x":"","it":["1. netmask","2. OSPF process ID","3. router ID","4. IP address","5. area ID","6. timers"],"g":["must be unique","must match","unused answer"],"a":[1,2,0,0,1,1],"e":""},{"t":"Drag and drop the IPv4 network subnets from the left onto the correct usable host ranges on the right.","x":"","it":["172.28.228.144/18","172.28.228.144/21","172.28.228.144/23","172.28.228.144/25","172.28.228.144/29"],"g":["172.28.192.1 – 172.28.255.254","172.28.224.1 – 172.28.231.254","172.28.228.1 – 172.28.229.254","172.28.228.129 – 172.28.228.254","172.28.228.145 – 172.28.228.150"],"a":[0,1,2,3,4],"e":"<p>+ 172.28.228.144/18: 172.28.192.1 – 172.28.255.254<br>+ 172.28.228.144/21: 172.28.224.1 – 172.28.231.254<br>+ 172.28.228.144/23: 172.28.228.1 – 172.28.229.254<br>+ 172.28.228.144/25: 172.28.228.129 – 172.28.228.254<br>+ 172.28.228.144/29: 172.28.228.145 – 172.28.228.150<\/p><p>This subnet question requires us to grasp how to subnet very well. To quickly find out the subnet range, we have to find out the increment and the network address of each subnet. Let’s take an example with the subnet 172.28.228.144/18:<\/p><p>From the /18 (= 1100 0000 in the 3rd octet), we find out the increment is 64. Therefore the network address of this subnet must be the greatest multiple of the increment but not greater than the value in the 3rd octet (228). We can find out the 3rd octet of the network address is 192 (because 192 = 64 * 3 and 192 &lt; 228) -> The network address is 172.28.192.0. So the first usable host should be 172.28.192.1 and it matches with the 5th answer on the right. In this case we don’t need to calculate the broadcast address because we found the correct answer.<\/p><p>Let’s take another example with subnet 172.28.228.144/23 -> The increment is 2 (as /23 = 1111 1110 in 3rd octet). The 3rd octet of the network address is 228 (because 228 is the multiply of 2 and equal to the 3rd octet) -> The network address is 172.28.228.0 -> The first usable host is 172.28.228.1. It is not necessary but if we want to find out the broadcast address of this subnet, we can find out the next network address, which is 172.28.(228 + the increment number).0 or 172.28.230.0 then reduce 1 bit -> 172.28.229.255 is the broadcast address of our subnet. Therefore the last usable host is 172.28.229.254.<\/p><p>If you are still unclear about how to do subnetting quickly, please read part 3 of our “Subnetting Tutorial – Subnetting Made Easy” at <a href=\"https://www.9tut.com/subnetting-tutorial/3\">https://www.9tut.com/subnetting-tutorial/3<\/a><\/p>"},{"t":"Drag and drop the threat-mitigation techniques from the left onto the types of threat or attack they mitigate on the right.","x":"","it":["802.1q double tagging","ARP spoofing","unwanted superior BPDUs","unwanted BPDUs on PortFast-enabled interfaces"],"g":["Configure a VLAN access control list","Configure the dynamic ARP inspection feature","Configure the root guard feature","Configure the BPDU guard feature"],"a":[0,1,2,3],"e":"<p>+ 802.1q double tagging: Configure VACL<br>+ ARP spoofing: Configure dynamic ARP inspection<br>+ unwanted superior BPDUs: Configure root guard<br>+ unwanted BPDUs on PortFast-enabled interfaces: Configure BPDU guard<\/p><p><b>Double-Tagging attack:<\/b><\/p><pre>Attacker --VLAN 10--> Company Switch A --Native VLAN 10--> Company Switch B --VLAN 20--> Victim\n[Payload|VLAN 20|VLAN 10]  [Payload|VLAN 20]            [Payload]<\/pre><p>In this attack, the attacking computer generates frames with two 802.1Q tags. The first tag matches the native VLAN of the trunk port (VLAN 10 in this case), and the second matches the VLAN of a host it wants to attack (VLAN 20).<\/p><p>When the packet from the attacker reaches Switch A, Switch A only sees the first VLAN 10 and it matches with its native VLAN 10 so this VLAN tag is removed. Switch A forwards the frame out all links with the same native VLAN 10. Switch B receives the frame with an tag of VLAN 20 so it removes this tag and forwards out to the Victim computer.<\/p><p>Note: This attack only works if the trunk (between two switches) has the same native VLAN as the attacker.<\/p><p>To mitigate this type of attack, you can use VLAN access control lists (VACLs, which applies to all traffic within a VLAN. We can use VACL to drop attacker traffic to specific victims/servers) or implement Private VLANs.<\/p><p><b>ARP attack (like ARP poisoning/spoofing)<\/b> is a type of attack in which a malicious actor sends falsified ARP messages over a local area network as ARP allows a gratuitous reply from a host even if an ARP request was not received. This results in the linking of an attacker’s MAC address with the IP address of a legitimate computer or server on the network. This is an attack based on ARP which is at Layer 2. Dynamic ARP inspection (DAI) is a security feature that validates ARP packets in a network which can be used to mitigate this type of attack.<\/p>"},{"t":"Drag and drop the description of file-transfer protocols from the left onto the correct protocols on the right.","x":"","it":["1. does not require user authentication","2. uses UDP","3. uses TCP","4. uses ports 20 and 21","5. provides reliability when loading an IOS image upon boot up","6. uses port 69"],"g":["FTP","TFTP"],"a":[1,1,0,0,0,1],"e":""},{"t":"Drag and drop the application protocols from the left onto the suitable transport protocols on the right.","x":"","it":["1. SMTP","2. SNMP","3. DHCP","4. TFTP","5. FTP","6. SSH"],"g":["TCP","UDP"],"a":[0,1,1,1,0,0],"e":""},{"t":"Drag and drop the descriptions of IP protocol transmissions from the left onto the correct IP traffic types on the right.","x":"","it":["1. Sends Transmission in Sequence","2. Transmits packets individually","3. Uses higher transmission rate to support latency-sensitive apps","4. Uses a lower transmission rate to ensure reliability","5. Transmissions include an 8-byte header","6. Transmits packet as stream"],"g":["TCP","UDP"],"a":[0,1,1,0,1,0],"e":"<p>UDP is a simpler message-based connectionless protocol. In connectionless protocols, there is no effort made to setup a dedicated end-to-end connection.<\/p><p>...<\/p><p>Datagrams - <b>Packets are sent individually<\/b> and are guaranteed to be whole if they arrive. Packets have definite bounds and no split or merge into data streams may exist.<\/p><p>According to <a href=\"https://community.cisco.com/t5/networking-documents/udp/ta-p/3114870\">https://community.cisco.com/t5/networking-documents/udp/ta-p/3114870<\/a><\/p><p>TCP is connection-oriented and UDP is connectionless. This means that before sending TCP packets, a connection is established between the server and the client. This process of setting up a connection is called TCP handshaking. The stream of packets is then sent over this connection -> TCP transmits packet as stream.<\/p><p>Reference: <a href=\"https://www.vpnmentor.com/blog/tcp-vs-udp/\">https://www.vpnmentor.com/blog/tcp-vs-udp/<\/a><\/p>"},{"t":"Drag and drop the WLAN components from the left onto the correct descriptions on the right.","x":"","it":["device that manages access points","device that provides Wi-Fi devices with a connection to a wired network","used for out of band management of a WLC","used to support mobility management of the WLC","applied to the WLAN for wireless client communication"],"g":["wireless LAN controller","access point","service port","virtual interface","dynamic interface"],"a":[0,1,2,3,4],"e":"<p>+ device that manages access points: wireless LAN controller<br>+ device that provides Wi-Fi devices with a connection to a wired network: access point<br>+ used for out of band management of a WLC: service port<br>+ used to support mobility management of the WLC: virtual interface<br>+ applied to the WLAN for wireless client communication: dynamic interface<\/p><p>The <b>service port<\/b> can be used management purposes, primarily for out-of-band management. However, AP management traffic is not possible across the service port. In most cases, the service port is used as a “last resort” means of accessing the controller GUI for management purposes. For example, in the case where the system distribution ports on the controller are down or their communication to the wired network is otherwise degraded.<\/p><p>A <b>dynamic interface<\/b> with the Dynamic AP Management option enabled is used as the tunnel source for packets from the controller to the access point and as the destination for CAPWAP packets from the access point to the controller.<\/p><p>The <b>virtual interface<\/b> is used to support mobility management, Dynamic Host Configuration Protocol (DHCP) relay, and embedded Layer 3 security such as guest web authentication. It also maintains the DNS gateway host name used by Layer 3 security and mobility managers to verify the source of certificates when Layer 3 web authorization is enabled.<\/p><p>Reference: <a href=\"https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-5/config-guide/b_cg85/ports_and_interfaces.html\">https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-5/config-guide/b_cg85/ports_and_interfaces.html<\/a><\/p>"},{"t":"Drag and drop the networking parameters from the left on to the correct values on the right.","x":"","it":["1. SMTP","2. SNMP","3. TFTP","4. VoIP","5. SSH","6. FTP"],"g":["Connection Oriented","Connectionless"],"a":[0,1,1,1,0,0],"e":"SSH uses TCP port 22 while SNMP uses UDP port 161 and 162."},{"t":"Drag drop the descriptions from the left on to the correct configuration-management technologies on the right.","x":"","it":["1. uses Ruby for fundamental configuration elements","2. uses TCP port 10002 for configuration push jobs","3. uses SSH for remote device communication","4. fundamental configuration elements are stored in a manifest","5. uses TCP 8140 for communication","6. uses YAML for fundamental configuration elements"],"g":["Ansible","Chef","Puppet"],"a":[1,1,0,2,2,0],"e":"<p>The focus of Ansible is to be streamlined and fast, and to require no node agent installation. Thus, Ansible performs all functions over SSH. Ansible is built on Python, in contrast to the Ruby foundation of Puppet and Chef.<\/p><p>TCP port 10002 is the command port. It may be configured in the Chef Push Jobs configuration file . This port allows Chef Push Jobs clients to communicate with the Chef Push Jobs server.<\/p><p>Puppet is an open-source configuration management solution, which is built with Ruby and offers custom Domain Specific Language (DSL) and Embedded Ruby (ERB) templates to create custom Puppet language files, offering a declarative-paradigm programming approach.<\/p><p>A Puppet piece of code is called a manifest, and is a file with .pp extension.<\/p>"},{"t":"Drag and drop the AAA functions from the left onto the correct AAA services on the right.","x":"","it":["1. records user activities","2. restricts the services that are available to a user","3. identifies the user","4. controls the actions that a user can perform","5. provides analytical information for the network administrator","6. verifies the password associated with a user"],"g":["Authentication","Authorization","Accounting"],"a":[2,1,0,1,2,0],"e":""},{"t":"Drag and Drop the benefits of a Cisco Wireless LAN Controller from the left onto the correct examples on the right.","x":"","it":["Dynamic RF Feature","Easy Deployment Process","Optimized user performance","Easy upgrade process"],"g":["Access points auto adjust signal strength","Controller provides centralized management of users and VLANs","Controller uses loadbalancing to maximize throughput","Controller image auto deployed to access Points"],"a":[0,1,2,3],"e":"<p>+ <b>Dynamic RF Feature<\/b>: Access points auto adjust signal strength<br>+ <b>Easy Deployment Process<\/b>: Controller provides centralized management of users and VLANs<br>+ <b>Optimized user performance<\/b>: Controller uses loadbalancing to maximize throughput<br>+ <b>Easy upgrade process<\/b>: Controller image auto deployed to access Points<\/p>"},{"t":"Drag and drop the Cisco Wireless LAN Controller security settings from the left onto the correct security mechanism categories on the right.","x":"","it":["1. web policy","2. Passthrough","3. WPA+WPA2","4. 802.1X"],"g":["Layer 2 Security Mechanism","Layer 3 Security Mechanisms (for WLAN)"],"a":[1,1,0,0],"e":"<p>Layer 2 Security Mechanism includes WPA+WPA2, 802.1X, Static WEP, CKIP while Layer 3 Security Mechanisms (for WLAN) includes IPSec, VPN Pass-Through, Web Passthrough …<\/p><p>Reference: <a href=\"https://www.cisco.com/c/en/us/support/docs/wireless/4400-series-wireless-lan-controllers/106082-wlc-compatibility-matrix.html\">https://www.cisco.com/c/en/us/support/docs/wireless/4400-series-wireless-lan-controllers/106082-wlc-compatibility-matrix.html<\/a><\/p>"}],"misc":[{"t":"Which technology must be implemented to configure network device monitoring with the highest security?","x":"","o":["SNMPv3","NetFlow","syslog","IP SLA"],"c":[0],"m":false,"e":"<p>SNMPv3—The most up-to-date protocol focuses on security. SNMPv3 defines a security model, user-based security model (USM), and a view-based access control model (VACM). SNMPv3 USM provides data integrity, data origin authentication, message replay protection, and protection against disclosure of the message payload.<\/p><p>Reference: <a href=\"https://www.juniper.net/documentation/us/en/software/junos/network-mgmt/topics/topic-map/network-monitoring-by-using-snmp.html\">https://www.juniper.net/documentation/us/en/software/junos/network-mgmt/topics/topic-map/network-monitoring-by-using-snmp.html<\/a><\/p>"},{"t":"Which command can you enter to allow Telnet to be supported in addition to SSH?","x":"","o":["transport input telnet","transport input telnet ssh","privilege level 15","no transport input telnet"],"c":[1],"m":false,"e":""},{"t":"What are two differences between optical-fiber cabling and copper cabling? (Choose two)","x":"","o":["The glass core component is encased in a cladding","The data can pass through the cladding","Fiber connects to physical interfaces using RJ-45 connections","A BNC connector is used for fiber connections","Light is transmitted through the core of the fiber"],"c":[0,4],"m":true,"e":"<p>The two main elements of an optical fiber are its core and cladding. The “core”, or the axial part of the optical fiber made of silica glass, is the light transmission area of the fiber. It may sometimes be treated with a “doping” element to change its refractive index and therefore the velocity of light down the fiber.<\/p><p>The “cladding” is the layer completely surrounding the core.<\/p><svg class=\"t\" viewBox=\"0 0 300 150\" role=\"img\" aria-label=\"Optical fiber cross-section\"><circle cx=\"150\" cy=\"75\" r=\"68\" fill=\"#2C86C6\"/><circle cx=\"150\" cy=\"75\" r=\"42\" fill=\"#E09A1A\"/><circle cx=\"150\" cy=\"75\" r=\"20\" fill=\"#B31B1B\"/><text class=\"svgt\" x=\"235\" y=\"30\">Coating<\/text><text class=\"svgt\" x=\"198\" y=\"62\">Cladding<\/text><text class=\"svgt\" x=\"172\" y=\"98\">Core<\/text><\/svg><p>Reference: <a href=\"https://www.cisco.com/c/en/us/products/collateral/interfaces-modules/transceiver-modules/white_paper_c11-463661.html\">https://www.cisco.com/c/en/us/products/collateral/interfaces-modules/transceiver-modules/white_paper_c11-463661.html<\/a><\/p>"},{"t":"A device detects two stations transmitting frames at the same time. This condition occurs after the first 64 bytes of the frame is received interface counter increments?","x":"","o":["CRC","runt","late collision","collision"],"c":[2],"m":false,"e":"<p>A late collision is defined as any collision that occurs after the first 512 bits (or 64th byte) of the frame have been transmitted. The usual possible causes are full-duplex/half-duplex mismatch, exceeded Ethernet cable length limits, or defective hardware such as incorrect cabling, non-compliant number of hubs in the network, or a bad NIC.<\/p><p>Late collisions should never occur in a properly designed Ethernet network. They usually occur when Ethernet cables are too long or when there are too many repeaters in the network.<\/p><p>Reference: <a href=\"https://www.cisco.com/en/US/docs/internetworking/troubleshooting/guide/tr1904.html\">https://www.cisco.com/en/US/docs/internetworking/troubleshooting/guide/tr1904.html<\/a><\/p>"},{"t":"A network engineer must back up 20 network router configurations globally within a customer environment. Which protocol allows the engineer to perform this function using the copy function?","x":"","o":["SNMP","SMTP","COP","ARP"],"c":[0],"m":false,"e":"<p>SNMP is an application-layer protocol that provides a message format for communication between SNMP managers and agents. SNMP provides a standardized framework and a common language used for the monitoring and management of devices in a network.<br>The SNMP framework has three parts:<br>+ An SNMP manager<br>+ An SNMP agent<br>+ A Management Information Base (MIB)<\/p><p>The Management Information Base (MIB) is a virtual information storage area for network management information, which consists of collections of managed objects.<\/p><p>With SNMP, the network administrator can send commands to multiple routers to do the backup.<\/p>"},{"t":"A network analyst is tasked with configuring the date and time on a router using EXEC mode. The date must be set to January 1,2020 and the time must be set to 12:00 am. Which command should be used?","x":"","o":["clock timezone","clock set","clock summer-time date","clock summer-time recurring"],"c":[1],"m":false,"e":"<p>In this example, the clock time is set to 12:00 am with the clock date of January 1,2020.<\/p><pre>R1#clock set 12:00:00 jan 1 2020<\/pre>"},{"t":"A Cisco IP phone receive untagged data traffic from an attached PC. Which action is taken by the phone?","x":"","o":["It allows the traffic to pass through unchanged","It tags the traffic with the default VLAN","It drops the traffic","It tags the traffic with the native VLAN"],"c":[0],"m":false,"e":"<p>Untagged traffic from the device attached to the Cisco IP Phone passes through the phone unchanged, regardless of the trust state of the access port on the phone.<\/p><p>Reference: <a href=\"https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst2960/software/release/12-2_40_se/configuration/guide/scg/swvoip.pdf\">https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst2960/software/release/12-2_40_se/configuration/guide/scg/swvoip.pdf<\/a><\/p>"},{"t":"Which function does an SNMP agent perform?","x":"","o":["It coordinates user authentication between a network device and a TACACS+ or RADIUS server","It requests information from remote network nodes about catastrophic system events.","It manages routing between Layer 3 devices in a network","It sends information about MIB variables in response to requests from the NMS"],"c":[3],"m":false,"e":""}],"topo":[{"t":"Which purpose does a northbound API serve in a controller-based networking architecture?","x":"","o":["facilitates communication between the controller and the applications","reports device errors to a controller","generates statistics for network hardware and traffic","communicates between the controller and the physical network hardware"],"c":[0],"m":false,"e":""},{"t":"What is a characteristic of spine-and-leaf architecture?","x":"","o":["It provides greater predictability on STP blocked ports","It provides variable latency","Each device is separated by the same number of hops","Each link between leaf switches allows for higher bandwidth"],"c":[2],"m":false,"e":"<p>Spine-leaf architecture is typically deployed as two layers: spines (such as an aggregation layer), and leaves (such as an access layer). Spine-leaf topologies provide high-bandwidth, <b>low-latency<\/b> (-> Answer 'It provides variable latency' is not correct), nonblocking server-to-server connectivity.<\/p><p>With a spine-and-leaf architecture, no matter which leaf switch to which a server is connected, <b>its traffic always has to cross the same number of devices to get to another server<\/b> (unless the other server is located on the same leaf) (-> Answer 'Each device is separated by the same number of hops' is correct) . This approach keeps latency at a predictable level because a payload only has to hop to a spine switch and another leaf switch to reach its destination.<\/p><p>Reference: <a href=\"https://www.cisco.com/c/en/us/products/collateral/switches/nexus-7000-series-switches/white-paper-c11-737022.html\">https://www.cisco.com/c/en/us/products/collateral/switches/nexus-7000-series-switches/white-paper-c11-737022.html<\/a><\/p><p>With Leaf-Spine, the network uses Layer 3 routing so <b>STP is no longer required<\/b>. (-> Answer 'It provides greater predictability on STP blocked ports' is not correct). Spine-leaf architectures rely on protocols such as Equal-Cost Multipath (ECPM) routing to load balance traffic across all available paths while still preventing network loops. This allows all connections to be utilized at the same time while still remaining stable and avoiding loops within the network.<\/p><svg class=\"t\" viewBox=\"0 0 600 220\" role=\"img\" aria-label=\"Spine and leaf topology\"><line x1=\"200\" y1=\"40\" x2=\"60\" y2=\"150\" stroke=\"#2EA043\" stroke-width=\"1.5\"/><line x1=\"200\" y1=\"40\" x2=\"156\" y2=\"150\" stroke=\"#2EA043\" stroke-width=\"1.5\"/><line x1=\"200\" y1=\"40\" x2=\"252\" y2=\"150\" stroke=\"#2EA043\" stroke-width=\"1.5\"/><line x1=\"200\" y1=\"40\" x2=\"348\" y2=\"150\" stroke=\"#2EA043\" stroke-width=\"1.5\"/><line x1=\"200\" y1=\"40\" x2=\"444\" y2=\"150\" stroke=\"#2EA043\" stroke-width=\"1.5\"/><line x1=\"200\" y1=\"40\" x2=\"540\" y2=\"150\" stroke=\"#2EA043\" stroke-width=\"1.5\"/><line x1=\"400\" y1=\"40\" x2=\"60\" y2=\"150\" stroke=\"#2EA043\" stroke-width=\"1.5\"/><line x1=\"400\" y1=\"40\" x2=\"156\" y2=\"150\" stroke=\"#2EA043\" stroke-width=\"1.5\"/><line x1=\"400\" y1=\"40\" x2=\"252\" y2=\"150\" stroke=\"#2EA043\" stroke-width=\"1.5\"/><line x1=\"400\" y1=\"40\" x2=\"348\" y2=\"150\" stroke=\"#2EA043\" stroke-width=\"1.5\"/><line x1=\"400\" y1=\"40\" x2=\"444\" y2=\"150\" stroke=\"#2EA043\" stroke-width=\"1.5\"/><line x1=\"400\" y1=\"40\" x2=\"540\" y2=\"150\" stroke=\"#2EA043\" stroke-width=\"1.5\"/><rect class=\"n\" x=\"166\" y=\"27\" width=\"68\" height=\"26\" rx=\"6\"/><text class=\"svgt\" x=\"200\" y=\"44\" text-anchor=\"middle\">Spine<\/text><rect class=\"n\" x=\"366\" y=\"27\" width=\"68\" height=\"26\" rx=\"6\"/><text class=\"svgt\" x=\"400\" y=\"44\" text-anchor=\"middle\">Spine<\/text><rect class=\"n\" x=\"26\" y=\"137\" width=\"68\" height=\"26\" rx=\"6\"/><text class=\"svgt\" x=\"60\" y=\"154\" text-anchor=\"middle\">Leaf<\/text><line class=\"l\" x1=\"60\" y1=\"163\" x2=\"60\" y2=\"186\"/><text class=\"svgt\" x=\"60\" y=\"204\" text-anchor=\"middle\" style=\"font-size:10px\">WAN/Core router<\/text><rect class=\"n\" x=\"122\" y=\"137\" width=\"68\" height=\"26\" rx=\"6\"/><text class=\"svgt\" x=\"156\" y=\"154\" text-anchor=\"middle\">Leaf<\/text><line class=\"l\" x1=\"156\" y1=\"163\" x2=\"156\" y2=\"186\"/><text class=\"svgt\" x=\"156\" y=\"204\" text-anchor=\"middle\" style=\"font-size:10px\">Host<\/text><rect class=\"n\" x=\"218\" y=\"137\" width=\"68\" height=\"26\" rx=\"6\"/><text class=\"svgt\" x=\"252\" y=\"154\" text-anchor=\"middle\">Leaf<\/text><line class=\"l\" x1=\"252\" y1=\"163\" x2=\"252\" y2=\"186\"/><text class=\"svgt\" x=\"252\" y=\"204\" text-anchor=\"middle\" style=\"font-size:10px\">Firewall<\/text><rect class=\"n\" x=\"314\" y=\"137\" width=\"68\" height=\"26\" rx=\"6\"/><text class=\"svgt\" x=\"348\" y=\"154\" text-anchor=\"middle\">Leaf<\/text><line class=\"l\" x1=\"348\" y1=\"163\" x2=\"348\" y2=\"186\"/><text class=\"svgt\" x=\"348\" y=\"204\" text-anchor=\"middle\" style=\"font-size:10px\">Internet router<\/text><rect class=\"n\" x=\"410\" y=\"137\" width=\"68\" height=\"26\" rx=\"6\"/><text class=\"svgt\" x=\"444\" y=\"154\" text-anchor=\"middle\">Leaf<\/text><line class=\"l\" x1=\"444\" y1=\"163\" x2=\"444\" y2=\"186\"/><text class=\"svgt\" x=\"444\" y=\"204\" text-anchor=\"middle\" style=\"font-size:10px\">Server<\/text><rect class=\"n\" x=\"506\" y=\"137\" width=\"68\" height=\"26\" rx=\"6\"/><text class=\"svgt\" x=\"540\" y=\"154\" text-anchor=\"middle\">Leaf<\/text><line class=\"l\" x1=\"540\" y1=\"163\" x2=\"540\" y2=\"186\"/><text class=\"svgt\" x=\"540\" y=\"204\" text-anchor=\"middle\" style=\"font-size:10px\">Server<\/text><\/svg>"},{"t":"Which two functions are performed by the core layer in a three-tier architecture? (Choose two)","x":"","o":["Inspect packets for malicious activity","Provide uninterrupted forwarding service","Ensure timely data transfer between layers","Police traffic that is sent to the edge of the network","Provide direct connectivity for end user devices"],"c":[1,2],"m":true,"e":"<p>Considerations at the core layer include<br>+ Providing high-speed switching (i.e., fast transport)<br>+ Providing reliability and fault tolerance<br>+ Scaling by using faster, and not more, equipment<br>+ Avoiding CPU-intensive packet manipulation caused by security, inspection, quality of service (QoS) classification, or other processes<\/p><p>Reference: <a href=\"https://www.ciscopress.com/articles/article.asp?p=2202410&amp;seqNum=4\">https://www.ciscopress.com/articles/article.asp?p=2202410&amp;seqNum=4<\/a><\/p>"},{"t":"A company needs to interconnect several branch offices across a metropolitan area. The network engineer is seeking a solution that provides high-speed converged traffic, including voice, video, and data on the same network infrastructure. The company also wants easy integration to their existing LAN infrastructure in their office locations. Which technology should be recommended?","x":"","o":["ISDN","Frame Relay","VSAT","Ethernet WAN"],"c":[3],"m":false,"e":"Ethernet WAN offer the ability of using Ethernet over long-distance links."},{"t":"What is the name of the layer in the Cisco borderless switched network design that is considered to be the backbone used for high-speed connectivity and fault isolation?","x":"","o":["access","network","data link","core","network access"],"c":[3],"m":false,"e":"The key layers are access, distribution, and core. The core layer is the network backbone that hierarchically connects several layers of the network design, providing for connectivity between end devices, computing and data storage services located within the data center and other areas, and services within the network."},{"t":"Which two WAN architecture options help a business improve scalability and reliability for the network? (Choose two)","x":"","o":["dual-homed branches","single-homed branches","asynchronous routing","dynamic routing","static routing"],"c":[0,3],"m":true,"e":"<p>Dual-homed branches (branches connects to two ISPs or one ISP with two connections) increases reliability for the network.<\/p><p>Dynamic routing automatically use backup routes in the case of main routes fail which increases reliability. The configuration is remain unchanged or change a little when we expand the network thus increasing the scalability.<\/p><p>Note: A scalable network can expand quickly to support new users and applications without impacting the performance of the service being delivered to existing users<\/p>"},{"t":"What are two descriptions of three-tier network topologies? (Choose two)","x":"","o":["The access layer manages routing between devices in different domains","The core and distribution layers perform the same functions","The core layer maintains wired connections for each host","The network core is designed to maintain continuous connectivity when devices fail","The distribution layer runs Layer 2 and Layer 3 technologies"],"c":[3,4],"m":true,"e":""},{"t":"What benefit does controller-based networking provide versus traditional networking?","x":"","o":["allows configuration and monitoring of the network from one centralized port","moves from a two-tier to a three-tier network architecture to provide maximum redundancy","provides an added layer of security to protect from DDoS attacks","combines control and data plane functionality on a single device to minimize latency"],"c":[0],"m":false,"e":""},{"t":"Which function is performed by the collapsed core layer in a two-tier architecture?","x":"","o":["attaching users to the edge of the network","applying security policies","marking interesting traffic for data polices","enforcing routing policies"],"c":[3],"m":false,"e":"<p>The three-tier hierarchical design maximizes performance, network availability, and the ability to scale the network design.<br>However, many small enterprise networks do not grow significantly larger over time. Therefore, a two-tier hierarchical design where the core and distribution layers are collapsed into one layer is often more practical. <b>A “collapsed core” is when the distribution layer and core layer functions are implemented by a single device<\/b>. The primary motivation for the collapsed core design is reducing network cost, while maintaining most of the benefits of the three-tier hierarchical model.<\/p><p>Reference: <a href=\"https://www.ciscopress.com/articles/article.asp?p=2202410&amp;seqNum=4\">https://www.ciscopress.com/articles/article.asp?p=2202410&amp;seqNum=4<\/a><\/p><p>A collapsed core network is shown below. The collapsed core network may be deployed with redundant core/distribution router, or consolidated core/distribution router.<\/p><p>Deploying a collapsed core network results in the distribution layer and core layer functions being implemented in a single device. The collapsed core/distribution device must provide the following:<br>+ High speed physical and logical paths connecting to the network<br>+ Layer-2 aggregation and demarcation point<br>+ Define <b>routing<\/b> and network access <b>policies<\/b> -> Answer 'enforcing routing policies' is correct<br>+ Intelligent network services—QoS, Network virtualization, etc.<\/p><p>Reference: <a href=\"https://www.cisco.com/c/en/us/td/docs/solutions/Enterprise/Small_Enterprise_Design_Profile/SEDP/chap2.html\">https://www.cisco.com/c/en/us/td/docs/solutions/Enterprise/Small_Enterprise_Design_Profile/SEDP/chap2.html<\/a><\/p>"},{"t":"Which WAN access technology is preferred for a small office / home office architecture?","x":"","o":["Integrated Services Digital Network switching","frame-relay packet switching","dedicated point-to-point leased line","broadband cable access"],"c":[3],"m":false,"e":""}],"vpn":[{"t":"What is a function of a remote access VPN?","x":"","o":["used exclusively when a user is connected to a company’s internal network","allows the users to access company internal network resources through a secure tunnel","establishes a secure tunnel between two branch sites","used cryptographic tunneling to protect the privacy of data for multiple users simultaneously"],"c":[1],"m":false,"e":""},{"t":"Which type of VPN uses a hub-and-spoke configuration to establish a full mesh topology?","x":"","o":["dynamic multipoint VPN","MPLS VPN","GRE over IPsec","IPsec virtual tunnel interface"],"c":[0],"m":false,"e":"<p>Dynamic Multipoint VPN (DMVPN) is a solution of Cisco. DMVPN provides the following advantages:<\/p><p>+ Provides full meshed connectivity with simple Hub-and-Spoke topology. The spokes can communicate between each other without going through Hub<br>+ Only one static public IP address is required on Hub. Spokes can use dynamic (unknown) public IP addresses.<br>+ The configuration is simple even in large network. No additional configuration is required on Hub when new Spokes are added.<\/p><svg class=\"t\" viewBox=\"0 0 400 210\" role=\"img\" aria-label=\"DMVPN hub and spokes\"><line class=\"l\" x1=\"200\" y1=\"40\" x2=\"60\" y2=\"150\"/><line class=\"l\" x1=\"200\" y1=\"40\" x2=\"200\" y2=\"175\"/><line class=\"l\" x1=\"200\" y1=\"40\" x2=\"340\" y2=\"150\"/><line class=\"d\" x1=\"60\" y1=\"150\" x2=\"200\" y2=\"175\"/><line class=\"d\" x1=\"200\" y1=\"175\" x2=\"340\" y2=\"150\"/><line class=\"d\" x1=\"60\" y1=\"150\" x2=\"340\" y2=\"150\"/><rect class=\"n\" x=\"166\" y=\"27\" width=\"68\" height=\"26\" rx=\"6\"/><text class=\"svgt\" x=\"200\" y=\"44\" text-anchor=\"middle\">Hub<\/text><rect class=\"n\" x=\"26\" y=\"137\" width=\"68\" height=\"26\" rx=\"6\"/><text class=\"svgt\" x=\"60\" y=\"154\" text-anchor=\"middle\">Spoke<\/text><rect class=\"n\" x=\"166\" y=\"162\" width=\"68\" height=\"26\" rx=\"6\"/><text class=\"svgt\" x=\"200\" y=\"179\" text-anchor=\"middle\">Spoke<\/text><rect class=\"n\" x=\"306\" y=\"137\" width=\"68\" height=\"26\" rx=\"6\"/><text class=\"svgt\" x=\"340\" y=\"154\" text-anchor=\"middle\">Spoke<\/text><text class=\"svgt\" x=\"200\" y=\"16\" text-anchor=\"middle\" font-weight=\"600\">HeadQuarter<\/text><text class=\"svgt\" x=\"60\" y=\"182\" text-anchor=\"middle\">Branch 1<\/text><text class=\"svgt\" x=\"200\" y=\"205\" text-anchor=\"middle\">Branch 2<\/text><text class=\"svgt\" x=\"340\" y=\"182\" text-anchor=\"middle\">Branch 3<\/text><\/svg>"},{"t":"What mechanism carries multicast traffic between remote sites and supports encryption?","x":"","o":["IPsec over ISATAP","ISATAP","GRE","GRE over IPsec"],"c":[3],"m":false,"e":""}],"aaa":[{"t":"Which effect does the <b>aaa new-model<\/b> configuration command have?","x":"","o":["It enables AAA services on the device.","It configures the device to connect to a RADIUS server for AAA.","It associates RADIUS server to an AAA group.","It configures a local user on the device."],"c":[0],"m":false,"e":""},{"t":"How do AAA operations compare regarding user identification, user services and access control?","x":"","o":["Authentication identifies users and accounting tracks user services","Authorization provides access control and authentication tracks user services","Authorization identifies users and authentication provides access control","Accounting tracks user services, and authentication provides access control"],"c":[0],"m":false,"e":""},{"t":"AAA stands for authentication, authorization, and accounting.","x":"","o":["True","False"],"c":[0],"m":false,"e":""},{"t":"What is a difference between RADIUS and TACACS+?","x":"","o":["RADIUS logs all commands that are entered by the administrator, but TACACS+ logs only start, stop, and interim commands","TACACS+ separates authentication and authorization, and RADIUS merges them","RADIUS is most appropriate for dial authentication, but TACACS+ can be used for multiple types of authentication","TACACS+ encrypts only password information and RADIUS encrypts the entire payload"],"c":[1],"m":false,"e":""},{"t":"Refer to the exhibit. Which password must an engineer use to enter the enable mode?","x":"<pre>Atlanta#config t\nAtlanta(config)#aaa new-model\nAtlanta(config)#aaa authentication login default local\nAtlanta(config)#line vty 0 4\nAtlanta(config-line)#login authentication default\nAtlanta(config-line)#exit\nAtlanta(config)#username ciscoadmin password adminadmin123\nAtlanta(config)#username ciscoadmin privilege 15\nAtlanta(config)#enable password cisco123\nAtlanta(config)#enable secret testing1234\nAtlanta(config)#end<\/pre>","o":["testing1234","cisco123","default","adminadmin123"],"c":[0],"m":false,"e":"<p>If neither the <b>enable password<\/b> command nor the <b>enable secret<\/b> command is configured, and if there is a line password configured for the console, the console line password serves as the enable password for all VTY sessions -> The “enable secret” will be used first if available, then “enable password” and line password.<\/p>"},{"t":"What is the primary difference between AAA authentication and authorization?","x":"","o":["Authentication verifies a username and password, and authorization handles the communication between the authentication agent and the user database","Authentication controls the system processes a user can access and authorization logs the activities the user initiates","Authentication identifies and verifies a user who is attempting to access a system, and authorization controls the tasks the user can perform","Authentication identifies a user who is attempting to access a system, and authorization validates the users password"],"c":[2],"m":false,"e":"<p>AAA stands for Authentication, Authorization and Accounting.<\/p><p>+ <b>Authentication:<\/b> Specify who you are (usually via login username &amp; password)<br>+ <b>Authorization<\/b>: Specify what actions you can do, what resource you can access<br>+ <b>Accounting<\/b>: Monitor what you do, how long you do it (can be used for billing and auditing)<\/p><p>An example of AAA is shown below:<\/p><p>+ <b>Authentication:<\/b> “I am a normal user. My username/password is <b>user_tom/learnforever<\/b>“<br>+ <b>Authorization<\/b>: “<b>user_tom<\/b> can access <b>LearnCCNA<\/b> server via <b>HTTP<\/b> and <b>FTP<\/b>“<br>+ <b>Accounting<\/b>: “<b>user_tom<\/b> accessed <b>LearnCCNA<\/b> server for <b>2 hours<\/b>“. This user only uses “show” commands.<\/p>"}],"basic":[{"t":"What is a function of TFTP in network operations?","x":"","o":["transfers IOS images from a server to a router for firmware upgrades","transfers a configuration files from a server to a router on a congested link","transfers files between file systems on a router","transfers a backup configuration file from a server to a switch using a username and password"],"c":[0],"m":false,"e":""},{"t":"What are two functions of a server on a network? (Choose two)","x":"","o":["achieves redundancy by exclusively using virtual server clustering","handles requests from multiple workstations at the same time","runs applications that send and retrieve data for workstations that make requests","housed solely in a data center that is dedicated to a single client","runs the same operating system in order to communicate with other servers"],"c":[1,2],"m":true,"e":""},{"t":"What is the default behavior of a Layer 2 switch when a frame with an unknown destination MAC address is received?","x":"","o":["The Layer 2 switch drops the received frame","The Layer 2 switch floods packets to all ports except the receiving port in the given VLAN","The Layer 2 switch forwards the packet and adds the destination MAC address to its MAC address table","The Layer 2 switch sends a copy of a packet to CPU for destination MAC address learning"],"c":[1],"m":false,"e":"If the destination MAC address is not in the CAM table (unknown destination MAC address), the switch sends the frame out all other ports that are in the same VLAN as the received frame. This is called flooding. It does not flood the frame out the same port on which the frame was received."},{"t":"What is the same for both copper and fiber interfaces when using SFP modules?","x":"","o":["They support an inline optical attenuator to enhance signal strength","They provide minimal interruption to services by being hot-swappable","They accommodate single-mode and multi-mode in a single module","They offer reliable bandwidth up to 100 Mbps in half duplex mode"],"c":[1],"m":false,"e":""},{"t":"What are two reasons that cause late collisions to increment on an Ethernet interface? (Choose two)","x":"","o":["when a collision occurs after the 32nd byte of a frame has been transmitted","when one side of the connection is configured for half-duplex","when the sending device waits 15 seconds before sending the frame again","when Carrier Sense Multiple Access/Collision Detection is used","when the cable length limits are exceeded"],"c":[1,4],"m":true,"e":"<p>A late collision is defined as any collision that occurs after the first 512 bits (or 64th byte) of the frame have been transmitted. The usual possible causes are full-duplex/half-duplex mismatch, exceeded Ethernet cable length limits, or defective hardware such as incorrect cabling, non-compliant number of hubs in the network, or a bad NIC.<\/p><p>Late collisions should never occur in a properly designed Ethernet network. They usually occur when Ethernet cables are too long or when there are too many repeaters in the network.<\/p><p>Reference: <a href='https://www.cisco.com/en/US/docs/internetworking/troubleshooting/guide/tr1904.html'>https://www.cisco.com/en/US/docs/internetworking/troubleshooting/guide/tr1904.html<\/a><\/p>"},{"t":"In which way does a spine-and-leaf architecture allow for scalability in a network when additional access ports are required?","x":"","o":["A spine switch and a leaf switch can be added with redundant connections between them","A spine switch can be added with at least 40 GB uplinks","A leaf switch can be added with a single connection to a core spine switch","A leaf switch can be added with connections to every spine switch"],"c":[3],"m":false,"e":"<p>Spine-leaf architecture is typically deployed as two layers: spines (such as an aggregation layer), and leaves (such as an access layer). Spine-leaf topologies provide high-bandwidth, low-latency, nonblocking server-to-server connectivity.<\/p><p>Leaf (access) switches are what provide devices access to the fabric (the network of spine and leaf switches) and are typically deployed at the top of the rack. Generally, devices connect to the leaf switches. Devices can include servers, Layer 4-7 services (firewalls and load balancers), and WAN or Internet routers. Leaf switches do not connect to other leaf switches. In spine-and-leaf architecture, every leaf should connect to every spine in a full mesh.<\/p><p>Spine (aggregation) switches are used to connect to all leaf switches and are typically deployed at the end or middle of the row. Spine switches do not connect to other spine switches.<\/p><p>Reference: <a href='https://www.cisco.com/c/en/us/products/collateral/switches/nexus-9000-series-switches/guide-c07-733228.html'>https://www.cisco.com/c/en/us/products/collateral/switches/nexus-9000-series-switches/guide-c07-733228.html<\/a><\/p><svg class=\"t\" viewBox=\"0 0 600 220\" role=\"img\" aria-label=\"Spine and leaf topology\"><line x1=\"200\" y1=\"40\" x2=\"60\" y2=\"150\" stroke=\"#2EA043\" stroke-width=\"1.5\"/><line x1=\"200\" y1=\"40\" x2=\"156\" y2=\"150\" stroke=\"#2EA043\" stroke-width=\"1.5\"/><line x1=\"200\" y1=\"40\" x2=\"252\" y2=\"150\" stroke=\"#2EA043\" stroke-width=\"1.5\"/><line x1=\"200\" y1=\"40\" x2=\"348\" y2=\"150\" stroke=\"#2EA043\" stroke-width=\"1.5\"/><line x1=\"200\" y1=\"40\" x2=\"444\" y2=\"150\" stroke=\"#2EA043\" stroke-width=\"1.5\"/><line x1=\"200\" y1=\"40\" x2=\"540\" y2=\"150\" stroke=\"#2EA043\" stroke-width=\"1.5\"/><line x1=\"400\" y1=\"40\" x2=\"60\" y2=\"150\" stroke=\"#2EA043\" stroke-width=\"1.5\"/><line x1=\"400\" y1=\"40\" x2=\"156\" y2=\"150\" stroke=\"#2EA043\" stroke-width=\"1.5\"/><line x1=\"400\" y1=\"40\" x2=\"252\" y2=\"150\" stroke=\"#2EA043\" stroke-width=\"1.5\"/><line x1=\"400\" y1=\"40\" x2=\"348\" y2=\"150\" stroke=\"#2EA043\" stroke-width=\"1.5\"/><line x1=\"400\" y1=\"40\" x2=\"444\" y2=\"150\" stroke=\"#2EA043\" stroke-width=\"1.5\"/><line x1=\"400\" y1=\"40\" x2=\"540\" y2=\"150\" stroke=\"#2EA043\" stroke-width=\"1.5\"/><rect class=\"n\" x=\"166\" y=\"27\" width=\"68\" height=\"26\" rx=\"6\"/><text class=\"svgt\" x=\"200\" y=\"44\" text-anchor=\"middle\">Spine<\/text><rect class=\"n\" x=\"366\" y=\"27\" width=\"68\" height=\"26\" rx=\"6\"/><text class=\"svgt\" x=\"400\" y=\"44\" text-anchor=\"middle\">Spine<\/text><rect class=\"n\" x=\"26\" y=\"137\" width=\"68\" height=\"26\" rx=\"6\"/><text class=\"svgt\" x=\"60\" y=\"154\" text-anchor=\"middle\">Leaf<\/text><text class=\"svgt\" x=\"60\" y=\"196\" text-anchor=\"middle\" style=\"font-size:10px\">WAN/Core router<\/text><rect class=\"n\" x=\"122\" y=\"137\" width=\"68\" height=\"26\" rx=\"6\"/><text class=\"svgt\" x=\"156\" y=\"154\" text-anchor=\"middle\">Leaf<\/text><text class=\"svgt\" x=\"156\" y=\"196\" text-anchor=\"middle\" style=\"font-size:10px\">Host<\/text><rect class=\"n\" x=\"218\" y=\"137\" width=\"68\" height=\"26\" rx=\"6\"/><text class=\"svgt\" x=\"252\" y=\"154\" text-anchor=\"middle\">Leaf<\/text><text class=\"svgt\" x=\"252\" y=\"196\" text-anchor=\"middle\" style=\"font-size:10px\">Firewall<\/text><rect class=\"n\" x=\"314\" y=\"137\" width=\"68\" height=\"26\" rx=\"6\"/><text class=\"svgt\" x=\"348\" y=\"154\" text-anchor=\"middle\">Leaf<\/text><text class=\"svgt\" x=\"348\" y=\"196\" text-anchor=\"middle\" style=\"font-size:10px\">Internet router<\/text><rect class=\"n\" x=\"410\" y=\"137\" width=\"68\" height=\"26\" rx=\"6\"/><text class=\"svgt\" x=\"444\" y=\"154\" text-anchor=\"middle\">Leaf<\/text><text class=\"svgt\" x=\"444\" y=\"196\" text-anchor=\"middle\" style=\"font-size:10px\">Server<\/text><rect class=\"n\" x=\"506\" y=\"137\" width=\"68\" height=\"26\" rx=\"6\"/><text class=\"svgt\" x=\"540\" y=\"154\" text-anchor=\"middle\">Leaf<\/text><text class=\"svgt\" x=\"540\" y=\"196\" text-anchor=\"middle\" style=\"font-size:10px\">Server<\/text><\/svg>"},{"t":"What is the function of a server?","x":"","o":["It creates security zones between trusted and untrusted networks","It provides shared applications to end users","It routes traffic between Layer 3 devices","It transmits packets between hosts in the same broadcast domain"],"c":[1],"m":false,"e":""},{"t":"Which two statements about the purpose of the OSI model are accurate? (Choose two)","x":"","o":["Ensures reliable data delivery through its layered approach","Defines the network functions that occur at each layer","Facilitates an understanding of how information travels throughout a network","Changes in one layer do not impact other layer"],"c":[1,2],"m":true,"e":""},{"t":"What is the primary function of a Layer 3 device?","x":"","o":["to transmit wireless traffic between hosts","forward traffic within the same broadcast domain","to pass traffic between different networks","to analyze traffic and drop unauthorized traffic from the Internet"],"c":[2],"m":false,"e":""},{"t":"What is the destination MAC address of a broadcast frame?","x":"","o":["00:00:0crfHfrff","00:00:0c:07:ac:01","ff:ff:ff:ff:ff:ff","43:2e:08:00:00:0c","00:00:0c:43:2e:08"],"c":[2],"m":false,"e":""},{"t":"Which action is taken by a switch port enabled for PoE power classification override?","x":"","o":["When a powered device begins drawing power from a PoE switch port a syslog message is generated","As power usage on a PoE switch port is checked data flow to the connected device is temporarily paused","If a switch determines that a device is using less than the minimum configured power it assumes the device has failed and disconnects","If a monitored port exceeds the maximum administrative value for power, the port is shutdown and err-disabled"],"c":[3],"m":false,"e":"<p>PoE monitoring and policing compares the power consumption on ports with the administrative maximum value (either a configured maximum value or the port’s default value). If the power consumption on a monitored port exceeds the administrative maximum value, the following actions occur:<\/p><p>+ A syslog message is issued.<br>+ The monitored port is shut down and error-disabled.<br>+ The allocated power is freed.<\/p>"},{"t":"A frame that enters a switch fails the Frame Check Sequence. Which two interface counters are incremented? (Choose two)","x":"","o":["input errors","runts","giants","frame","CRC"],"c":[0,4],"m":true,"e":"<p>Whenever the physical transmission has problems, the receiving device might receive a frame whose bits have changed values. These frames do not pass the error detection logic as implemented in the FCS field in the Ethernet trailer. The receiving device discards the frame and counts it as some kind of input error. Cisco switches list this error as a CRC error. Cyclic redundancy check (CRC) is a term related to how the FCS math detects an error.<\/p><p>The “input errors” includes runts, giants, no buffer, CRC, frame, overrun, and ignored counts.<\/p><p>The output below show the interface counters with the “show interface s0/0/0” command:<\/p><pre>Router#show interface s0/0/0\nSerial0/0/0 is up, line protocol is up\nHardware is M4T\nDescription: Link to R2\nInternet address is 10.1.1.1/30\nMTU 1500 bytes, BW 1544 Kbit, DLY 20000 usec,\nreliability 255/255, txload 1/255, rxload 1/255\n--output omitted--\n5 minute output rate 0 bits/sec, 0 packets/sec\n268 packets input, 24889 bytes, 0 no buffer\nReceived 0 broadcasts, 0 runts, 0 giants, 0 throttles\n0 input errors, 0 CRC, 0 frame, 0 overrun, 0 ignored, 0 abort\n251 packets output, 23498 bytes, 0 underruns\n0 output errors, 0 collisions, 0 interface resets\n0 output buffer failures, 0 output buffers swapped out\n0 carrier transitions DCD=up DSR=up DTR=up RTS=up CTS=up<\/pre>"}],"cdp":[{"t":"Refer to the exhibit. Which command provides this output?","x":"<pre>Capability Codes: R - Router, T - Trans Bridge, B - Source Route Bridge\n S - Switch, H - Host, I - IGMP, r - Repeater, P - Phone,\n D - Remote, C - CVTA, M - Two-port Mac Relay\nDevice ID  Local Intrfce  Holdtme  Capability  Platform  Port ID\n10.1.1.2   Gig 37/3       176      R I         CPT 600   Gig 36/41\n10.1.1.2   Gig 37/1       174      R I         CPT 600   Gig 36/43\n10.1.1.2   Gig 36/41      134      R I         CPT 600   Gig 37/3\n10.1.1.2   Gig 36/43      134      R I         CPT 600   Gig 37/1\n10.1.1.2   Ten 3/2        132      R I         CPT 600   Ten 4/2\n10.1.1.2   Ten 4/2        174      R I         CPT 600   Ten 3/2<\/pre>","o":["show ip route","show ip interface","show interface","show cdp neighbor"],"c":[3],"m":false,"e":""},{"t":"An engineer needs to configure LLDP to send the port description time length value (TLV). What command sequence must be implemented?","x":"","o":["switch#lldp port-description","switch(config)#lldp port-description","switch(config)#interface gi1/0/1\nswitch(config-if)#lldp port-description","switch#interface gi1/0/1\nswitch(config-if)#lldp port-description"],"c":[1],"m":false,"e":"<p>Use the switch(config)#lldp port-description option to specify the port description TLV messages.<\/p>"},{"t":"A network engineer must create a diagram of a multivendor network. Which command must be configured on the Cisco devices so that the topology of the network can be mapped?","x":"","o":["Device(Config)#lldp run","Device(Config)#cdp run","Device(Config-if)#cdp enable","Device(Config)#flow-sampler-map topology"],"c":[0],"m":false,"e":""},{"t":"In a CDP environment, what happens when the CDP interface on an adjacent device is configured without an IP address?","x":"","o":["CDP operates normally, but it cannot provide any information for that neighbor.","CDP operates normally, but it cannot provide IP address information for that neighbor.","CDP uses the IP address of another interface for that neighbor.","CDP becomes inoperable on that neighbor."],"c":[2],"m":false,"e":"<p>If a neighbor has no IP address on an interface enabled with Cisco Discovery Protocol, the IP address of another interface will be updated as IP address for the non-IP address interface.<\/p><p>Reference: <a href='https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/cdp/configuration/15-mt/cdp-15-mt-book/nm-cdp-discover.html'>https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/cdp/configuration/15-mt/cdp-15-mt-book/nm-cdp-discover.html<\/a><\/p>"},{"t":"How can the Cisco Discovery Protocol be used?","x":"","o":["to allow a switch to discover the devices that are connected to its ports","to determine the hardware platform of the device","to determine the IP addresses of connected Cisco devices","all of the above"],"c":[3],"m":false,"e":""},{"t":"Which command is used to specify the delay time in seconds for LLDP to initialize on any interface?","x":"","o":["lldp timer","lldp holdtime","lldp reinit","lldp tlv-select"],"c":[2],"m":false,"e":"<p>+ lldp holdtime seconds: Specify the amount of time a receiving device should hold the information from your device before discarding it<br>+ lldp reinit delay: Specify the delay time in seconds for LLDP to initialize on an interface<br>+ lldp timer rate: Set the sending frequency of LLDP updates in seconds<\/p><p>Reference: <a href='https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst3560/software/release/12-2_55_se/configuration/guide/3560_scg/swlldp.html'>https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst3560/software/release/12-2_55_se/configuration/guide/3560_scg/swlldp.html<\/a><\/p>"},{"t":"Which command should you enter to configure an LLDP delay time of 5 seconds?","x":"","o":["lldp reinit 5","lldp reinit 5000","lldp holdtime 5","lldp timer 5000"],"c":[0],"m":false,"e":"<p>+ lldp holdtime seconds: Specify the amount of time a receiving device should hold the information from your device before discarding it<br>+ lldp reinit delay: Specify the delay time in seconds for LLDP to initialize on an interface<br>+ lldp timer rate: Set the sending frequency of LLDP updates in seconds<\/p><p>Reference: <a href='https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst3560/software/release/12-2_55_se/configuration/guide/3560_scg/swlldp.html'>https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst3560/software/release/12-2_55_se/configuration/guide/3560_scg/swlldp.html<\/a><\/p>"},{"t":"Which command is used to enable LLDP globally on a Cisco IOS ISR?","x":"","o":["lldp run","lldp enable","lldp transmit","cdp run","cdp enable"],"c":[0],"m":false,"e":"<p>Link Layer Discovery Protocol (LLDP) is a industry standard protocol that allows devices to advertise, and discover connected devices, and there capabilities (same as CDP of Cisco). To enable it on Cisco devices, we have to use this command under global configuration mode:<\/p><pre>Switch(config)# lldp run<\/pre>"}],"dai":[{"t":"Refer to the exhibit. What is the effect of this configuration?","x":"<pre>ip arp inspection vlan 2\ninterface fastethernet 0/1\n switchport mode access\n switchport access vlan 2<\/pre>","o":["All ingress and egress traffic is dropped because the interface is untrusted","Egress traffic is passed only if the destination is a DHCP server.","The switch discard all ingress ARP traffic with invalid MAC-to-IP address bindings","All ARP packets are dropped by the switch"],"c":[2],"m":false,"e":"Dynamic ARP inspection is an ingress security feature; it does not perform any egress checking."},{"t":"Refer to the exhibit. What is the effect of this configuration?","x":"<pre>ip arp inspection vlan 2\ninterface fastethernet 0/1\n switchport mode access\n switchport access vlan 2<\/pre>","o":["Dynamic ARP inspection is disabled because the ARP ACL is missing","The switch port interface trust state becomes untrusted","The switch port remains administratively down until the interface is connected to another switch","The switch port remains down until it is configured to trust or untrust incoming packets"],"c":[1],"m":false,"e":"Dynamic ARP inspection (DAI) is a security feature that validates ARP packets in a network. It intercepts, logs, and discards ARP packets with invalid IP-to-MAC address bindings. This capability protects the network from certain man-in-the-middle attacks. After enabling DAI, all ports become untrusted ports."}],"eigrp":[{"t":"Refer to the exhibit.<br>Which route type does the routing protocol Code <b>D<\/b> represent in the output?","x":"<pre>      10.0.0.0/24 is subnetted, 1 subnets\nC         10.0.0.0 is directly connected, FastEthernet0/1\nC     172.16.0.0/16 is directly connected, FastEthernet0/0\nD     192.168.0.0/24 [90/30720] via 172.16.0.2, 00:00:04, FastEthern
